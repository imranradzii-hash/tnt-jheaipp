<!DOCTYPE html>
<html lang="ms">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Tuntutan Perjalanan (TNT) JHEAIPP</title>
<style>
  /* ---------- Token reka bentuk: warna Jata Negeri Pulau Pinang ---------- */
  :root {
    --navy: #0b2a4a; --navy-2: #103a66;
    --biru: #044caa; --biru-gelap: #033a85; --biru-lembut: #eaf1fb; --biru-garis: #c2d5f0;
    --kuning: #f9db00; --kuning-lembut: #fff8d1; --kuning-teks: #6b5600;
    --latar: #f2f5f9; --permukaan: #ffffff; --garis: #dce3ec; --garis-kuat: #c5cfdb;
    --teks: #13233a; --teks-2: #4b5c72; --teks-3: #77879a;
    --ok: #0f7a4a; --ok-lembut: #e3f5ec; --amaran: #8a5a00; --amaran-lembut: #fff3d6; --sekat: #b42318; --sekat-lembut: #fdecea;
    --r: 10px; --r-kecil: 6px;
    --bayang: 0 1px 2px rgba(11, 42, 74, .06), 0 2px 8px rgba(11, 42, 74, .04);
    --bayang-timbul: 0 8px 28px rgba(11, 42, 74, .16);
    /* alias nama lama yang masih dirujuk dalam kod */
    --utama: var(--biru); --utama-gelap: var(--biru-gelap); --utama-lembut: var(--biru-lembut);
    --lemah: var(--teks-2); --kad: var(--permukaan); --bg: var(--latar);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--latar); color: var(--teks); font: 15px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
  h1, h2, h3 { line-height: 1.25; }
  .angka { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid var(--biru); outline-offset: 2px; }
  .jalur-bendera { height: 4px; background: linear-gradient(90deg, var(--biru) 0 33.33%, #fff 33.33% 66.66%, var(--kuning) 66.66%); }

  /* ---------- Kepala & navigasi ---------- */
  header.atas { background: linear-gradient(100deg, var(--navy), var(--navy-2)); color: #fff; }
  header.atas .dalam { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .jenama { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .jenama img { height: 46px; width: auto; flex: none; }
  .jenama .nama-sistem { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: .01em; }
  .jenama .nama-jabatan { font-size: 12px; opacity: .85; }
  .pengguna { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .pengguna .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--kuning); color: var(--navy); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .pengguna button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: var(--r-kecil); padding: 6px 12px; font: inherit; cursor: pointer; min-height: 34px; }
  .pengguna button:hover { background: rgba(255,255,255,.1); }
  .pengguna button:focus-visible { outline-color: var(--kuning); }
  nav.tab { background: var(--permukaan); border-bottom: 1px solid var(--garis); }
  nav.tab .dalam { max-width: 1200px; margin: 0 auto; display: flex; gap: 2px; padding: 0 8px; overflow-x: auto; }
  nav.tab button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 13px 14px 10px; font: inherit; font-size: 14px; color: var(--teks-2); cursor: pointer; white-space: nowrap; min-height: 46px; }
  nav.tab button:hover { color: var(--teks); }
  nav.tab button.aktif { color: var(--biru); border-bottom-color: var(--kuning); font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 32px; }

  /* ---------- Permukaan, tajuk, medan ---------- */
  .kad { background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--r); padding: 20px; margin-bottom: 16px; box-shadow: var(--bayang); }
  .kad h2 { font-size: 17px; margin: 0 0 4px; }
  .kad h3 { font-size: 12px; margin: 20px 0 10px; color: var(--teks-2); text-transform: uppercase; letter-spacing: .06em; }
  .kad > .bantuan:first-of-type { margin-top: 0; }
  .tajuk-halaman { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin: 4px 0 18px; }
  .tajuk-halaman h1 { font-size: 22px; margin: 0; }
  .tajuk-halaman p { margin: 4px 0 0; color: var(--teks-2); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px 16px; }
  .penuh { grid-column: 1 / -1; }
  label.medan { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--teks); }
  label.medan .bantuan { font-weight: 400; }
  input, select, textarea { font: inherit; font-size: 15px; font-weight: 400; color: var(--teks); padding: 9px 11px; border: 1px solid var(--garis-kuat); border-radius: var(--r-kecil); background: #fff; width: 100%; min-height: 42px; }
  input::placeholder, textarea::placeholder { color: var(--teks-3); }
  textarea { min-height: 70px; resize: vertical; }
  input:hover, select:hover, textarea:hover { border-color: #9fb0c4; }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--biru-lembut); border-color: var(--biru); }
  input[type=checkbox] { min-height: 0; width: 18px; height: 18px; accent-color: var(--biru); }
  input[type=file] { padding: 7px; background: var(--latar); }

  /* ---------- Butang ---------- */
  button.btn { font: inherit; font-size: 14px; font-weight: 600; border-radius: var(--r-kecil); padding: 9px 16px; min-height: 40px; border: 1px solid var(--biru); background: var(--biru); color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button.btn:hover { background: var(--biru-gelap); border-color: var(--biru-gelap); }
  button.btn:active { transform: translateY(1px); }
  button.btn.kedua { background: #fff; color: var(--biru); border-color: var(--biru-garis); }
  button.btn.kedua:hover { background: var(--biru-lembut); border-color: var(--biru); }
  button.btn.bahaya { background: #fff; color: var(--sekat); border-color: #f0c2bd; }
  button.btn.bahaya:hover { background: var(--sekat-lembut); }
  button.btn.kecil { padding: 5px 11px; min-height: 32px; font-size: 13px; }
  button.btn.besar { padding: 12px 22px; min-height: 48px; font-size: 15px; }
  button:disabled { opacity: .55; cursor: wait; }
  button.pautan { background: none; border: 0; color: var(--biru); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .kumpul { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .baris-alat { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .baris-alat h2 { margin: 0; font-size: 20px; }
  .bantuan { font-size: 13px; color: var(--teks-2); line-height: 1.5; }

  /* ---------- Jadual ---------- */
  .jadual-skrol { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th { text-align: left; font-weight: 600; color: var(--teks-2); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--garis-kuat); padding: 10px; white-space: nowrap; background: #f8fafc; }
  table.data td { border-bottom: 1px solid var(--garis); padding: 10px; vertical-align: middle; }
  table.data tbody tr:hover td { background: #f8fbff; }
  table.data td.nombor, table.data th.nombor { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.data tfoot td { border-bottom: 0; }

  /* ---------- Lencana & notis ---------- */
  .lencana { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--biru-lembut); color: var(--biru); white-space: nowrap; }
  .lencana::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .lencana.ok { background: var(--ok-lembut); color: var(--ok); }
  .lencana.amaran { background: var(--amaran-lembut); color: var(--amaran); }
  .lencana.neutral { background: #eef1f5; color: var(--teks-2); }
  .notis { border-radius: var(--r-kecil); padding: 12px 14px; font-size: 14px; margin-bottom: 14px; border: 1px solid transparent; }
  .notis.amaran { background: var(--amaran-lembut); color: var(--amaran); border-color: #f1d9a3; }
  .notis.sekat { background: var(--sekat-lembut); color: var(--sekat); border-color: #f0c2bd; }
  .notis.info { background: var(--biru-lembut); color: var(--biru-gelap); border-color: var(--biru-garis); }
  .notis ul { margin: 6px 0 0; padding-left: 18px; }
  .kosong { color: var(--teks-2); padding: 18px 0; text-align: center; }

  /* ---------- Papan utama (senarai tuntutan) ---------- */
  .salam { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; background: linear-gradient(100deg, var(--biru-lembut), #fff 70%); border: 1px solid var(--biru-garis); border-left: 5px solid var(--kuning); border-radius: var(--r); padding: 18px 20px; margin-bottom: 18px; }
  .salam h1 { font-size: 20px; margin: 0; }
  .salam p { margin: 4px 0 0; color: var(--teks-2); font-size: 14px; }
  .dua-lajur { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; }
  .langkah-mini { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px; padding: 0; list-style: none; counter-reset: l; }
  .langkah-mini li { counter-increment: l; font-size: 13px; color: var(--teks-2); display: flex; align-items: center; gap: 6px; }
  .langkah-mini li::before { content: counter(l); width: 20px; height: 20px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

  /* ---------- Editor tuntutan: bahagian bernombor ---------- */
  .susun-editor { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
  details.bahagian { background: var(--permukaan); border: 1px solid var(--garis); border-radius: var(--r); margin-bottom: 12px; box-shadow: var(--bayang); }
  details.bahagian[open] { border-color: var(--biru-garis); }
  details.bahagian > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto auto; gap: 14px; align-items: center; padding: 16px 18px; border-radius: var(--r); }
  details.bahagian > summary::-webkit-details-marker { display: none; }
  details.bahagian > summary:hover { background: #f8fbff; }
  details.bahagian > summary .no { width: 32px; height: 32px; border-radius: 50%; background: var(--biru-lembut); color: var(--biru); font-weight: 700; display: grid; place-items: center; font-size: 14px; }
  details.bahagian[open] > summary .no { background: var(--biru); color: #fff; }
  details.bahagian > summary .tajuk { font-weight: 700; font-size: 16px; }
  details.bahagian > summary .sub { font-size: 13px; color: var(--teks-2); margin-top: 2px; }
  details.bahagian > summary .nilai { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--teks); white-space: nowrap; }
  details.bahagian > summary .nilai.sifar { color: var(--teks-3); font-weight: 400; }
  details.bahagian > summary .anak-panah { width: 10px; height: 10px; border-right: 2px solid var(--teks-3); border-bottom: 2px solid var(--teks-3); transform: rotate(45deg); transition: transform .15s; margin-right: 4px; }
  details.bahagian[open] > summary .anak-panah { transform: rotate(-135deg); }
  details.bahagian > .isi-bahagian { padding: 4px 18px 20px; border-top: 1px solid var(--garis); }
  .kad-perjalanan { border: 1px solid var(--garis); border-left: 4px solid var(--biru); border-radius: var(--r-kecil); padding: 14px; margin: 14px 0 0; background: #fbfcfe; }
  .kad-perjalanan .kepala { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .kad-perjalanan .kepala b { font-size: 14px; color: var(--navy); }
  .kad-perjalanan .medan-jalan { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1.2fr .9fr; gap: 10px 12px; }
  .kad-perjalanan .medan-jalan .penuh { grid-column: 1 / -1; }
  .tambah-jalan { margin-top: 14px; width: 100%; justify-content: center; border-style: dashed !important; }
  .ringkasan { position: sticky; top: 16px; }
  .ringkasan h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--teks-2); }
  .ringkasan table { width: 100%; font-size: 14px; border-collapse: collapse; margin-top: 6px; }
  .ringkasan td { padding: 7px 0; border-bottom: 1px dashed var(--garis); }
  .ringkasan td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .ringkasan tr.jumlah td { border-bottom: 0; border-top: 2px solid var(--navy); font-weight: 700; font-size: 18px; padding-top: 10px; color: var(--navy); }
  .bar-tindakan { position: sticky; bottom: 0; z-index: 20; margin-top: 16px; background: rgba(255,255,255,.96); backdrop-filter: blur(6px); border: 1px solid var(--garis); border-top: 3px solid var(--kuning); border-radius: var(--r) var(--r) 0 0; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 -6px 20px rgba(11, 42, 74, .08); }
  .bar-tindakan .jumlah-bar { font-size: 13px; color: var(--teks-2); }
  .bar-tindakan .jumlah-bar b { display: block; font-size: 20px; color: var(--navy); font-variant-numeric: tabular-nums; }

  /* ---------- Muka log masuk: pemandangan Pulau Pinang ---------- */
  .lm { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 460px); background: var(--navy); }
  .lm-hero { position: relative; overflow: hidden; min-height: 100vh; color: #fff; }
  .lm-hero svg.pemandangan { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lm-hero .tindih { position: relative; z-index: 2; padding: 40px 48px; max-width: 640px; }
  .lm-hero .jata-besar { width: 78px; height: auto; filter: drop-shadow(0 4px 14px rgba(0,0,0,.35)); animation: timbul 1.1s ease-out both; }
  .lm-hero .kerajaan { margin-top: 18px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--kuning); font-weight: 700; animation: timbul 1.1s .15s ease-out both; }
  .lm-hero h1 { font-size: 34px; margin: 8px 0 6px; font-weight: 800; letter-spacing: -.01em; animation: timbul 1.1s .25s ease-out both; text-shadow: 0 2px 16px rgba(0,0,0,.25); }
  .lm-hero .jabatan { font-size: 16px; opacity: .92; animation: timbul 1.1s .35s ease-out both; }
  .lm-hero .langkah { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; animation: timbul 1.1s .5s ease-out both; }
  .lm-hero .langkah div { background: rgba(11, 42, 74, .55); border: 1px solid rgba(255,255,255,.2); backdrop-filter: blur(4px); border-radius: 999px; padding: 7px 14px 7px 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .lm-hero .langkah b { width: 22px; height: 22px; border-radius: 50%; background: var(--kuning); color: var(--navy); display: grid; place-items: center; font-size: 12px; }
  .lm-panel { background: var(--latar); display: flex; flex-direction: column; justify-content: center; padding: 32px 28px; border-left: 4px solid var(--kuning); }
  .lm-panel .kad { padding: 26px; box-shadow: var(--bayang-timbul); border: 0; }
  .lm-panel .kad > * + * { margin-top: 14px; }
  .lm-panel .kad h2 { font-size: 20px; }
  .lm-panel .notis-privasi { margin: 18px 0 0; padding: 0; font-size: 12px; }
  .lm-panel form button.btn { width: 100%; justify-content: center; }
  .lm-panel form p { margin: 0 0 12px; }
  .lm-panel .pautan-bawah { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; font-size: 14px; }
  @keyframes timbul { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes awan { from { transform: translateX(-260px); } to { transform: translateX(1460px); } }
  @keyframes kereta-kanan { from { transform: translateX(-80px); } to { transform: translateX(1300px); } }
  @keyframes kereta-kiri { from { transform: translateX(1300px); } to { transform: translateX(-80px); } }
  @keyframes ombak { from { transform: translateX(0); } to { transform: translateX(-200px); } }
  @keyframes kelip { 0%, 100% { opacity: .25; } 50% { opacity: .95; } }
  @keyframes denyut { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .6; transform: scale(1.08); } }
  @keyframes burung { from { transform: translate(-60px, 0); } to { transform: translate(1300px, -60px); } }
  @keyframes kapal { from { transform: translateX(1250px); } to { transform: translateX(-200px); } }
  .pemandangan .awan { animation: awan linear infinite; }
  .pemandangan .kr { animation: kereta-kanan linear infinite; }
  .pemandangan .kl { animation: kereta-kiri linear infinite; }
  .pemandangan .ombak { animation: ombak linear infinite; }
  .pemandangan .lampu { animation: kelip ease-in-out infinite; }
  .pemandangan .cahaya-matahari { transform-origin: 980px 440px; animation: denyut 6s ease-in-out infinite; }
  .pemandangan .burung { animation: burung linear infinite; }
  .pemandangan .kapal { animation: kapal linear infinite; }
  @media (prefers-reduced-motion: reduce) {
    .pemandangan *, .lm-hero * { animation: none !important; }
  }

  /* ---------- Lain-lain ---------- */
  #toast { position: fixed; bottom: 90px; right: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; z-index: 60; pointer-events: none; }
  #toast div { background: var(--navy); color: #fff; padding: 11px 16px; border-radius: var(--r-kecil); max-width: 480px; box-shadow: var(--bayang-timbul); pointer-events: auto; border-left: 4px solid var(--kuning); }
  #toast div.ralat { background: var(--sekat); border-left-color: #fff; }
  .notis-privasi { max-width: 1200px; margin: 0 auto 32px; padding: 0 16px; font-size: 12px; color: var(--teks-3); }
  footer.kaki { text-align: center; font-size: 12px; color: var(--teks-3); padding: 0 16px 24px; }

  @media (max-width: 960px) {
    .susun-editor, .dua-lajur { grid-template-columns: minmax(0, 1fr); }
    .ringkasan { position: static; }
    .kad-perjalanan .medan-jalan { grid-template-columns: 1fr 1fr; }
    .kad-perjalanan .medan-jalan .tarikh-jalan { grid-column: 1 / -1; }
    .lm { grid-template-columns: 1fr; }
    .lm-hero { min-height: 470px; }
    .lm-hero .tindih { padding: 22px 20px 70px; background: linear-gradient(180deg, rgba(6, 26, 51, .92) 0%, rgba(6, 26, 51, .82) 70%, rgba(6, 26, 51, 0) 100%); max-width: none; }
    .lm-hero .kerajaan { margin-top: 12px; font-size: 11px; }
    .lm-hero .jabatan { font-size: 14px; }
    .lm-hero h1 { font-size: 24px; }
    .lm-hero .jata-besar { width: 54px; }
    .lm-hero .langkah { display: none; }
    .lm-panel { border-left: 0; border-top: 4px solid var(--kuning); padding: 20px 16px 32px; justify-content: flex-start; }
    .jenama img { height: 38px; }
    .jenama .nama-sistem { font-size: 14px; }
    details.bahagian > summary { grid-template-columns: auto 1fr auto; padding: 14px; }
    details.bahagian > summary .anak-panah { display: none; }
  }
  @media print { .bar-tindakan, nav.tab, header.atas { display: none; } }
</style>
</head>

<div id="app"></div>
<div id="toast"></div>
<script>

<script>

// ------------------------------------------------------------ Utiliti DOM

function el(tag, props, ...anak) {
  const n = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'checked' || k === 'disabled') n[k] = v;
      else n.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of anak.flat()) {
    if (c === null || c === undefined || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}
/** append() asli menukar null kepada teks "null"; fungsi ini abaikan null/false. */
function letak(n, ...anak) {
  for (const c of anak.flat()) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
const kosongkan = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
function medan(label, input, bantuan, penuh) {
  return el('label', { class: 'medan' + (penuh ? ' penuh' : '') }, label, input, bantuan ? el('span', { class: 'bantuan' }, bantuan) : null);
}
function beritahu(mesej, ralat) {
  const d = el('div', { class: ralat ? 'ralat' : '' }, mesej);
  document.getElementById('toast').append(d);
  setTimeout(() => d.remove(), ralat ? 8000 : 3500);
}
function simpanToken(t) {
  try { t ? sessionStorage.setItem('tnt_token', t) : sessionStorage.removeItem('tnt_token'); } catch (e) { /* storan disekat */ }
}
function bacaToken() {
  try { return sessionStorage.getItem('tnt_token'); } catch (e) { return null; }
}
// Kosong bila dibuka dari Apps Script (google.script.run). Diisi semasa bina untuk hos luar (Netlify).
const API_URL = '@@API_URL@@';

async function jalanWeb(fn, args) {
  let r;
  try {
    // text/plain supaya tiada CORS preflight (Apps Script tidak menjawab OPTIONS)
    r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }) });
  } catch (e) { throw new Error('Tidak dapat menghubungi pelayan. Semak sambungan internet.'); }
  if (!r.ok) throw new Error('Pelayan tidak dapat dihubungi (kod ' + r.status + ').');
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Jawapan pelayan tidak sah. Semak tetapan deploy Apps Script (akses: Anyone).'); }
  if (!j.ok) throw new Error(j.ralat);
  return j.hasil;
}

function jalan(fn, ...args) {
  if (API_URL && /^https:/.test(API_URL)) return jalanWeb(fn, args);
  if (window.google && google.script && google.script.run) {
    return new Promise((res, rej) => {
      const r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      r[fn].apply(r, args);
    });
  }
  return Promise.reject(new Error('Alamat pelayan (APPS_SCRIPT_URL) belum ditetapkan.'));
}
const mesejRalat = (err) => String((err && err.message) || err).replace(/^Error:\s*/, '');
async function api(fn, ...args) {
  try {
    return await jalan(fn, S.token, ...args);
  } catch (err) {
    const m = mesejRalat(err);
    if (/Unauthorized/.test(m)) { S.token = null; simpanToken(null); paparLogMasuk('Sesi tamat. Sila log masuk semula.'); }
    throw new Error(m);
  }
}
async function tindakan(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { beritahu(mesejRalat(e), true); }
  finally { if (btn) btn.disabled = false; }
}
const rm = (n) => 'RM' + (Number(n) || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const bulanIni = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const hariIni = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const salin = (o) => JSON.parse(JSON.stringify(o));

function muatTurun(r) {
  const bin = atob(r.base64);
  const bait = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bait[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bait], { type: 'application/pdf' }));
  const a = el('a', { href: url, download: r.nama, target: '_blank', rel: 'noopener' }, 'Buka PDF');
  document.body.append(a);
  setTimeout(() => { a.click(); a.remove(); }, 0);
}

async function cetak(btn, id) {
  await tindakan(btn, async () => {
    const asal = btn ? btn.textContent : '';
    if (btn) btn.textContent = 'Menjana PDF...';
    try {
      const r = await api('apiCetak', id);
      muatTurun(r);
      beritahu('PDF sedia. Cetak pada kertas A4.');
    } finally { if (btn) btn.textContent = asal; }
  });
}

function pemandanganSvg() {
  const r = (benih, maks) => { const x = Math.sin(benih * 12.9898 + 78.233) * 43758.5453; return (x - Math.floor(x)) * maks; }; // pseudo-rawak tetap 0..maks

  }
  // Bangunan bandar George Town (kiri dan kanan KOMTAR)

    bangunan += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${i % 2 ? '#0f3159' : '#123a68'}"/>`;
    for (let yy = y + 12; yy < 548; yy += 16) for (let xx = x + 8; xx < x + w - 8; xx += 14) {
      if (r(xx * 3 + yy, 1) > .55) lampu += `<rect class="lampu" x="${xx}" y="${yy}" width="6" height="7" fill="#f9db00" style="animation-duration:${(3 + r(xx + yy, 5)).toFixed(1)}s;animation-delay:${r(xx, 4).toFixed(1)}s"/>`;

  const garis = (y) => { let d = `M0 ${y}`; for (let x = 0; x < 2800; x += 100) d += ` q50 -12 100 0`; return d; };
  [[662, .55, 9], [690, .4, 13], [718, .5, 7], [744, .35, 11]].forEach(([y, op, dur]) => {

function masukSesi(r) {
  S.token = r.token; simpanToken(r.token);
  mula();
}

async function logKeluar() {
  try { await jalan('apiLogKeluar', S.token); } catch (e) { /* abaikan */ }
  S.token = null; simpanToken(null); S.boot = null;
  paparLogMasuk('Anda telah log keluar.');
}

const SHEETJS = { src: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  integrity: 'sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw' };

function muatSheetJS() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = el('script', { src: SHEETJS.src, integrity: SHEETJS.integrity, crossorigin: 'anonymous', referrerpolicy: 'no-referrer' });
    s.onload = res;
    s.onerror = () => rej(new Error('Gagal memuatkan pembaca Excel. Semak sambungan internet.'));
    document.head.append(s);
  });
}

/** Fail .xlsx → { helaian: { A1: nilai } }. Tarikh kekal sebagai nombor siri (ditukar oleh importBorang). */
async function bacaXlsx(fail) {
  await muatSheetJS();
  const wb = XLSX.read(await fail.arrayBuffer(), { type: 'array' });
  const buku = {};
  wb.SheetNames.forEach((n) => {
    const sh = wb.Sheets[n], h = {};
    Object.keys(sh).forEach((k) => { if (k[0] !== '!' && sh[k] && sh[k].v !== undefined) h[k] = sh[k].v; });
    buku[n] = h;
  });
  return buku;
}

function kadImport() {
  const fail = el('input', { type: 'file', accept: '.xlsx' });
  const kemas = el('input', { type: 'checkbox', checked: !S.boot.profil.nama || !S.boot.profil.ic, style: 'width:auto' });
  const btn = el('button', { class: 'btn kedua' }, 'Baca fail dan buka');
  btn.onclick = () => tindakan(btn, async () => {
    const f = fail.files[0];
    if (!f) throw new Error('Pilih fail .xlsx dahulu.');
    if (f.size > 5 * 1024 * 1024) throw new Error('Fail terlalu besar (had 5 MB).');
    const r = importBorang(await bacaXlsx(f));
    const d = r.data;
    if (d.pegawai.nama && kemas.checked) {
      const prof = Object.assign({}, S.boot.profil);
      MEDAN_PROFIL.forEach(([k]) => { if (d.pegawai[k]) prof[k] = d.pegawai[k]; });
      try {
        S.boot.profil = await api('apiSimpanProfil', prof);
        r.nota.unshift('Profil anda dikemaskini daripada Muka 1 fail ini.');
      } catch (e) { r.nota.unshift('Profil tidak dikemaskini: ' + e.message); }
    }
    // Medan pegawai yang kosong dalam fail diisi daripada profil
    MEDAN_PROFIL.forEach(([k]) => { if (!d.pegawai[k]) d.pegawai[k] = S.boot.profil[k] || ''; });
    if (!d.bulan) { d.bulan = bulanIni(); r.nota.unshift('Bulan tuntutan tidak dapat dikesan. Sila tetapkan bulan.'); }
    if (S.boot.tuntutan.some((t) => t.bulan === d.bulan)) {
      r.nota.unshift('Tuntutan ' + labelBulan(d.bulan) + ' sudah ada dalam sistem. Tukar bulan, atau padam tuntutan lama sebelum simpan.');
    }
    bukaEditor(null, d, { tajuk: 'Diimport daripada ' + f.name + ' (' + r.format + '). Semak, kemudian klik Simpan.', nota: r.nota, jumlahFail: r.jumlahFail });
  });
  return el('section', { class: 'kad' }, el('h2', null, 'Import borang lama (Excel)'),
    el('p', { class: 'bantuan' }, 'Pilih borang TNT yang pernah anda isi dalam Excel (format WP1.4 2026 atau borang 2024). ',
      'Fail dibaca dalam pelayar anda sahaja dan tidak dimuat naik. Hasilnya dibuka dalam editor untuk disemak sebelum disimpan.'),
    el('div', { class: 'grid' }, medan('Fail .xlsx', fail),
      el('label', { class: 'medan', style: 'flex-direction:row;align-items:center;gap:8px' }, kemas, 'Kemaskini profil saya dengan Muka 1 fail ini')),
    el('p'), btn);
}

function dataBaru(bulan) {
  const p = S.boot.profil;
  const peg = {};
  MEDAN_PROFIL.forEach(([k]) => { peg[k] = p[k] || ''; });
  return {
    bulan: bulan, pegawai: peg, perjalanan: [],
    makan: { sarapan: '', tengahari: '', malam: '', hari_makan: '', hari_harian: '' },
    lojing: { malam: '', senarai: [{ tarikh: '', alamat: '' }, { tarikh: '', alamat: '' }] },
    bsp: [{ kadar: '', hari: '', resit: '' }, { kadar: '', hari: '', resit: '' }],
    awam: Object.fromEntries(JENIS_AWAM.map((j) => [j.kod, { rm: '', resit: '' }])),
    tol: { rm: '', rujukan: '' }, parkir: { rm: '', rujukan: '' },
    pengakuan: { tanpa_resit: '', resit_bukan_nama: '', tarikh: '' }, pendahuluan: '',
    kadar_manual: { ELAUN_MAKAN: '', ELAUN_HARIAN: '', LOJING: '' }
  };
}

/** Lengkapkan struktur data lama supaya semua medan editor wujud. */
function lengkapkan(d) {
  const asas = dataBaru(d.bulan);
  const o = Object.assign(asas, d);
  o.makan = Object.assign(asas.makan, d.makan);
  o.lojing = Object.assign({ malam: '', senarai: [] }, d.lojing);
  while (o.lojing.senarai.length < 2) o.lojing.senarai.push({ tarikh: '', alamat: '' });
  o.bsp = (d.bsp || []).slice();
  while (o.bsp.length < 2) o.bsp.push({ kadar: '', hari: '', resit: '' });
  o.awam = Object.assign(dataBaru(d.bulan).awam, d.awam);
  o.kadar_manual = Object.assign({ ELAUN_MAKAN: '', ELAUN_HARIAN: '', LOJING: '' }, d.kadar_manual);
  return o;
}

async function viewAdmin() {

  const subtab = [['kadar', 'Kadar'], ['kumpulan', 'Kumpulan gred'], ['tetapan', 'Tetapan'], ['pengguna', 'Pengguna'], ['semua', 'Semua tuntutan'], ['log', 'Log audit']];

function adminKadar(isi) {
  const ctx = S.admin.konteks, KOD = S.admin.kodKadar;
  const hari = hariIni();
  // Kadar semasa (berkuat kuasa hari ini) dan akan datang
  const semasa = el('tbody');
  const kumpulan = ctx.kumpulan.map((k) => k.nama);
  Object.keys(KOD).forEach((kod) => {
    const senKump = KOD[kod].per_kumpulan ? kumpulan : [''];
    senKump.forEach((kp) => {
      const r = kadarPada(ctx.kadar, kod, kp, hari);
      const akan = ctx.kadar.filter((x) => x.kod === kod && x.kumpulan === kp && x.kuat_kuasa > hari).sort((a, b) => a.kuat_kuasa < b.kuat_kuasa ? -1 : 1);
      semasa.append(el('tr', null, el('td', null, KOD[kod].label), el('td', null, kp || '-'),
        el('td', { class: 'nombor' }, r ? r.nilai : el('span', { class: 'lencana amaran' }, 'Belum ditetapkan')),

  const pilihKump = el('select', { onchange: (e) => { f.kumpulan = e.target.value; } }, kumpulan.map((k) => el('option', { value: k }, k)));
  const medanKump = medan('Kumpulan gred', pilihKump);

  const pilihKod = el('select', { onchange: (e) => { f.kod = e.target.value; kemasKump(); } }, Object.keys(KOD).map((k) => el('option', { value: k, selected: k === f.kod }, KOD[k].label + ' (' + KOD[k].unit + ')')));
  const btn = el('button', { class: 'btn' }, 'Tambah kadar');
  btn.onclick = () => tindakan(btn, async () => {
    if (!confirm('Tambah kadar ' + KOD[f.kod].label + (KOD[f.kod].per_kumpulan ? ' (' + f.kumpulan + ')' : '') + ' = ' + f.nilai + ' mulai ' + formatTarikh(f.kuat_kuasa) + '?')) return;
    S.admin.konteks = await api('apiAdminTambahKadar', f);
    S.boot.konteks = S.admin.konteks;
    beritahu('Kadar ditambah.');
    kosongkan(isi); adminKadar(isi);
  });
  kemasKump();

  const sejarah = ctx.kadar.slice().sort((a, b) => (a.kod + a.kumpulan + b.kuat_kuasa) < (b.kod + b.kumpulan + a.kuat_kuasa) ? -1 : 1);
  letak(isi, 
    el('div', { class: 'kad' }, el('h2', null, 'Kadar berkuat kuasa hari ini'),
      el('p', { class: 'bantuan' }, 'Tuntutan dikira dengan kadar yang berkuat kuasa pada 1hb bulan tuntutan.'),
      el('div', { class: 'jadual-skrol' }, el('table', { class: 'data' }, el('thead', null, el('tr', null, ['Kadar', 'Kumpulan', 'Nilai', 'Mulai', 'Rujukan', 'Akan datang'].map((h) => el('th', null, h)))), semasa))),
    el('div', { class: 'kad' }, el('h2', null, 'Pekeliling baharu: tambah kadar'),
      el('div', { class: 'notis info' }, 'Contoh: surat JKN 24/04/2026 menaikkan kereta ke RM1.00 berkuat kuasa 1 Mei 2026 bagi tuntutan bulan April 2026. Pilih "Kereta: kadar peringkat pertama", nilai 1.00, tarikh 01/04/2026, rujukan JKNPP.100.4/1/4 (26). Ulang untuk setiap kadar yang berubah. Kadar lama tidak dipadam, jadi tuntutan bulan sebelumnya kekal guna kadar lama.'),
      el('div', { class: 'grid' }, medan('Kadar', pilihKod), medanKump,
        medan('Nilai', el('input', { type: 'number', step: 'any', min: '0', oninput: (e) => { f.nilai = e.target.value; } })),
        medan('Terpakai untuk tuntutan bermula', el('input', { type: 'date', value: f.kuat_kuasa, oninput: (e) => { f.kuat_kuasa = e.target.value; } }),
          'Kadar dipilih ikut 1hb bulan tuntutan. Jika pekeliling sebut "bagi tuntutan bulan April", isi 01/04.'),
        medan('Rujukan pekeliling', el('input', { placeholder: 'cth PP WP1.4 Pindaan 1/2027', oninput: (e) => { f.rujukan = e.target.value; } }), null, true)),
      !kumpulan.length ? el('p', { class: 'bantuan' }, 'Kadar elaun makan, harian dan lojing perlukan kumpulan gred. Cipta di tab Kumpulan gred dahulu.') : null,
      el('p'), btn),
    el('div', { class: 'kad' }, el('h2', null, 'Sejarah kadar'),
      el('div', { class: 'jadual-skrol' }, el('table', { class: 'data' },
        el('thead', null, el('tr', null, ['Kadar', 'Kumpulan', 'Nilai', 'Mulai', 'Rujukan', 'Oleh', ''].map((h) => el('th', null, h)))),
        el('tbody', null, sejarah.map((r) => {
          const b = el('button', { class: 'btn kecil bahaya' }, 'Padam');
          b.onclick = () => { if (confirm('Padam kadar ini? Hanya padam jika tersalah masuk. Tuntutan yang terlibat akan dikira semula bila dicetak.')) tindakan(b, async () => {
            S.admin.konteks = await api('apiAdminPadamKadar', r.id); S.boot.konteks = S.admin.konteks; kosongkan(isi); adminKadar(isi);
          }); };
          return el('tr', null, el('td', null, (KOD[r.kod] || {}).label || r.kod), el('td', null, r.kumpulan || '-'), el('td', { class: 'nombor' }, r.nilai),
            el('td', null, formatTarikh(r.kuat_kuasa)), el('td', null, r.rujukan), el('td', { class: 'bantuan' }, r.oleh), el('td', null, b));
        }))))));
}

function adminKumpulan(isi) {
  const ctx = S.admin.konteks;
  const f = { id: '', nama: '', gred_min: '', gred_maks: '', catatan: '' };
  const inN = el('input', { oninput: (e) => { f.nama = e.target.value; } });

  const inMaks = el('input', { type: 'number', min: '0', oninput: (e) => { f.gred_maks = e.target.value; } });
  const inC = el('input', { oninput: (e) => { f.catatan = e.target.value; } });
  const btn = el('button', { class: 'btn' }, 'Simpan kumpulan');
  btn.onclick = () => tindakan(btn, async () => {
    S.admin.konteks = await api('apiAdminSimpanKumpulan', f); S.boot.konteks = S.admin.konteks; beritahu('Kumpulan disimpan.'); kosongkan(isi); adminKumpulan(isi);
  });
  letak(isi, el('div', { class: 'kad' }, el('h2', null, 'Kumpulan gred'),
    el('p', { class: 'bantuan' }, 'Kadar elaun makan, harian dan lojing ditetapkan ikut kumpulan. Gred pegawai dipadankan ikut nombor (cth S29 → 29). Kosongkan gred maksimum untuk "dan ke atas".'),
    ctx.kumpulan.length ? el('table', { class: 'data' }, el('thead', null, el('tr', null, ['Nama', 'Gred', 'Catatan', ''].map((h) => el('th', null, h)))),
      el('tbody', null, ctx.kumpulan.map((k) => {
        const bU = el('button', { class: 'btn kecil kedua', onclick: () => { Object.assign(f, k); inN.value = k.nama; inMin.value = k.gred_min; inMaks.value = k.gred_maks; inC.value = k.catatan; inN.focus(); } }, 'Ubah');
        const bP = el('button', { class: 'btn kecil bahaya' }, 'Padam');
        bP.onclick = () => { if (confirm('Padam kumpulan ' + k.nama + '?')) tindakan(bP, async () => { S.admin.konteks = await api('apiAdminPadamKumpulan', k.id); S.boot.konteks = S.admin.konteks; kosongkan(isi); adminKumpulan(isi); }); };
        return el('tr', null, el('td', null, k.nama), el('td', null, k.gred_min + (k.gred_maks ? ' hingga ' + k.gred_maks : ' dan ke atas')), el('td', null, k.catatan), el('td', null, el('div', { class: 'kumpul' }, bU, bP)));
      }))) : el('p', { class: 'kosong' }, 'Belum ada kumpulan.'),
    el('h3', null, 'Tambah / ubah'),
    el('div', { class: 'grid' }, medan('Nama kumpulan', inN, 'cth GRED 1-18'), medan('Gred minimum', inMin), medan('Gred maksimum', inMaks), medan('Catatan', inC)),
    el('p'), btn));
}

function adminTetapan(isi) {
  letak(isi, el('div', { class: 'kad' }, el('h2', null, 'Tetapan'),
    S.admin.tetapan.map((t) => {
      const i = el(t.kunci === 'ALAMAT_PEJABAT' ? 'textarea' : 'input', { value: t.nilai });
      const b = el('button', { class: 'btn kecil' }, 'Simpan');
      b.onclick = () => tindakan(b, async () => {
        await api('apiAdminSimpanTetapan', t.kunci, i.value); t.nilai = i.value;
        if (t.kunci === 'ALAMAT_PEJABAT') S.boot.alamatPejabat = i.value;
        beritahu('Tetapan ' + t.kunci + ' disimpan.');
      });
      return el('div', { style: 'margin-bottom:14px' }, medan(t.kunci, i, t.keterangan, true), el('p', { style: 'margin:6px 0 0' }), b);
    })));
}

function adminPengguna(isi) {
  const cari = el('input', { type: 'search', placeholder: 'Cari nama atau emel...' });
  const badan = el('tbody');
  const papar = () => {
    const q = cari.value.toLowerCase();
    letak(kosongkan(badan), ...S.admin.pengguna.filter((u) => !q || (u.nama + ' ' + u.emel).toLowerCase().includes(q)).map((u) => {
      const role = el('select', null, [['pengguna', 'Pengguna'], ['admin', 'Admin']].map(([v, l]) => el('option', { value: v, selected: u.role === v }, l)));
      role.onchange = () => tindakan(role, async () => { await api('apiAdminKemaskiniPengguna', u.emel, { role: role.value }); u.role = role.value; beritahu('Peranan dikemaskini.'); });
      const aktif = el('select', null, [['YA', 'Aktif'], ['TIDAK', 'Tidak aktif']].map(([v, l]) => el('option', { value: v, selected: u.aktif === v }, l)));
      aktif.onchange = () => tindakan(aktif, async () => { await api('apiAdminKemaskiniPengguna', u.emel, { aktif: aktif.value }); u.aktif = aktif.value; beritahu('Status dikemaskini.'); });
      return el('tr', null, el('td', null, u.nama), el('td', null, u.emel), el('td', null, role), el('td', null, aktif), el('td', { class: 'bantuan' }, u.log_masuk_terakhir));
    }));
  };
  cari.oninput = papar;
  papar();
  letak(isi, el('div', { class: 'kad' }, el('h2', null, 'Pengguna (' + S.admin.pengguna.length + ')'), cari, el('p'),
    el('div', { class: 'jadual-skrol' }, el('table', { class: 'data' }, el('thead', null, el('tr', null, ['Nama', 'Emel', 'Peranan', 'Status', 'Log masuk terakhir'].map((h) => el('th', null, h)))), badan))));
}

async function adminSemua(isi) {
  const bulan = el('input', { type: 'month', value: bulanIni() });
  const hasil = el('div');
  const muat = async () => {
    letak(kosongkan(hasil), el('p', { class: 'kosong' }, 'Memuatkan...'));
    try {
      const sen = await api('apiAdminTuntutan', bulan.value);
      const jumlah = sen.reduce((s, t) => s + (Number(t.jumlah) || 0), 0);
      letak(kosongkan(hasil), sen.length ? el('div', { class: 'jadual-skrol' }, el('table', { class: 'data' },
        el('thead', null, el('tr', null, ['Nama', 'Emel', 'Bulan', 'Jumlah', 'Dicetak', ''].map((h) => el('th', { class: h === 'Jumlah' ? 'nombor' : '' }, h)))),
        el('tbody', null, sen.map((t) => {
          const bC = el('button', { class: 'btn kecil kedua' }, 'Cetak PDF'); bC.onclick = () => cetak(bC, t.id);
          const bB = el('button', { class: 'btn kecil' }, 'Buka');
          bB.onclick = () => tindakan(bB, async () => { const r = await api('apiBukaTuntutan', t.id); S.kembaliKe = 'admin'; bukaEditor(t.id, r.data); });
          return el('tr', null, el('td', null, t.nama), el('td', null, t.emel), el('td', null, t.label), el('td', { class: 'nombor' }, rm(t.jumlah)),
            el('td', null, t.dicetak_pada || '-'), el('td', null, el('div', { class: 'kumpul' }, bB, bC)));
        })),
        el('tfoot', null, el('tr', null, el('td', { colspan: '3' }, el('b', null, sen.length + ' tuntutan')), el('td', { class: 'nombor' }, el('b', null, rm(jumlah))), el('td'), el('td'))))) : el('p', { class: 'kosong' }, 'Tiada tuntutan.'));
    } catch (e) { letak(kosongkan(hasil), el('div', { class: 'notis sekat' }, e.message)); }
  };
  bulan.onchange = muat;
  letak(isi, el('div', { class: 'kad' }, el('h2', null, 'Semua tuntutan'), el('div', { class: 'grid' }, medan('Bulan (kosongkan untuk semua)', bulan)), el('p'), hasil));
  muat();
}

async function adminLog(isi) {
  const kad = el('div', { class: 'kad' }, el('h2', null, 'Log audit (200 terkini)'), el('p', { class: 'kosong' }, 'Memuatkan...'));

    letak(kad, el('div', { class: 'jadual-skrol' }, el('table', { class: 'data' },

}
