<!DOCTYPE html>
<html lang="ms">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Tuntutan Perjalanan (TNT) JHEAIPP</title>
<style>
  :root {
    --bg: #f4f6f3; --kad: #ffffff; --teks: #1c2a22; --lemah: #5b6b62; --garis: #dbe3dc;
    --utama: #0d6b4f; --utama-gelap: #08503a; --utama-lembut: #e3f2ec; --emas: #b8862b;
    --sekat: #b42318; --sekat-lembut: #fdecea; --amaran: #8a5a00; --amaran-lembut: #fff4dc;
    --ok: #0f7a4a; --ok-lembut: #e3f5ec; --jejari: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--teks); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header.atas { background: linear-gradient(120deg, #063d2d, var(--utama) 60%, #12855f); color: #fff; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  header.atas h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header.atas .kecil { font-size: 13px; opacity: .9; }
  header.atas button { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  nav.tab { background: var(--kad); border-bottom: 1px solid var(--garis); display: flex; gap: 4px; padding: 0 12px; overflow-x: auto; }
  nav.tab button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 12px 9px; font: inherit; color: var(--lemah); cursor: pointer; white-space: nowrap; }
  nav.tab button.aktif { color: var(--utama); border-bottom-color: var(--utama); font-weight: 600; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; }
  .kad { background: var(--kad); border: 1px solid var(--garis); border-radius: var(--jejari); padding: 16px; margin-bottom: 16px; }
  .kad h2 { font-size: 17px; margin: 0 0 12px; }
  .kad h3 { font-size: 13px; margin: 18px 0 8px; color: var(--lemah); text-transform: uppercase; letter-spacing: .03em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .penuh { grid-column: 1 / -1; }
  label.medan { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--lemah); }
  input, select, textarea { font: inherit; font-size: 15px; color: var(--teks); padding: 8px 10px; border: 1px solid var(--garis); border-radius: 8px; background: #fff; width: 100%; }
  textarea { min-height: 60px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--utama-lembut); border-color: var(--utama); }
  button.btn { font: inherit; font-size: 14px; border-radius: 8px; padding: 8px 14px; border: 1px solid var(--utama); background: var(--utama); color: #fff; cursor: pointer; }
  button.btn:hover { background: var(--utama-gelap); }
  button.btn.kedua { background: #fff; color: var(--utama); }
  button.btn.kedua:hover { background: var(--utama-lembut); }
  button.btn.bahaya { background: #fff; color: var(--sekat); border-color: var(--sekat); }
  button.btn.kecil { padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: .55; cursor: wait; }
  button.pautan { background: none; border: 0; color: var(--utama); cursor: pointer; font: inherit; padding: 0; text-decoration: underline; }
  .kumpul { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .baris-alat { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .baris-alat h2 { margin: 0; }
  .bantuan { font-size: 12px; color: var(--lemah); }
  .jadual-skrol { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data th { text-align: left; font-weight: 600; color: var(--lemah); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--garis); padding: 8px; white-space: nowrap; }
  table.data td { border-bottom: 1px solid var(--garis); padding: 6px 8px; vertical-align: top; }
  table.data td.nombor, table.data th.nombor { text-align: right; white-space: nowrap; }
  table.perjalanan td { padding: 4px; }
  table.perjalanan input, table.perjalanan select, table.perjalanan textarea { padding: 6px; font-size: 14px; }
  table.perjalanan textarea { min-height: 38px; min-width: 200px; }
  .lencana { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--utama-lembut); color: var(--utama); white-space: nowrap; }
  .lencana.amaran { background: var(--amaran-lembut); color: var(--amaran); }
  .notis { border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .notis.amaran { background: var(--amaran-lembut); color: var(--amaran); }
  .notis.sekat { background: var(--sekat-lembut); color: var(--sekat); }
  .notis.info { background: var(--utama-lembut); color: var(--utama-gelap); }
  .notis ul { margin: 4px 0 0; padding-left: 18px; }
  .susun-editor { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  .ringkasan { position: sticky; top: 12px; }
  .ringkasan table { width: 100%; font-size: 14px; border-collapse: collapse; }
  .ringkasan td { padding: 4px 0; }
  .ringkasan td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .ringkasan tr.jumlah td { border-top: 2px solid var(--teks); font-weight: 700; font-size: 16px; padding-top: 8px; }
  .log-masuk { min-height: 100vh; background: linear-gradient(135deg, #063d2d, var(--utama) 55%, #1a9a70); padding: 8vh 16px 16px; }
  .log-masuk .kad { max-width: 420px; margin: 0 auto; }
  .log-masuk .kad > * + * { margin-top: 12px; }
  .kosong { color: var(--lemah); padding: 12px 0; }
  #toast { position: fixed; bottom: 16px; right: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; z-index: 50; pointer-events: none; }
  #toast div { background: #1c2a22; color: #fff; padding: 10px 14px; border-radius: 8px; max-width: 480px; box-shadow: 0 4px 16px rgba(0,0,0,.2); pointer-events: auto; }
  #toast div.ralat { background: var(--sekat); }
  .notis-privasi { max-width: 1180px; margin: 0 auto 32px; padding: 0 16px; font-size: 12px; color: var(--lemah); }
  .log-masuk .notis-privasi { color: rgba(255,255,255,.85); max-width: 420px; margin-top: 16px; padding: 0; }
  @media (max-width: 860px) { .susun-editor { grid-template-columns: minmax(0, 1fr); } .ringkasan { position: static; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
// ---- Config.js
/**
 * Konfigurasi: nama tab, header lajur, kod kadar dan nilai lalai.
 * Kadar sebenar disimpan dalam tab Kadar (diubah oleh admin melalui web app),
 * setiap baris ada tarikh kuat kuasa supaya tuntutan bulan lama kekal guna kadar lama.
 */

var NAMA_SISTEM = 'Sistem Tuntutan Perjalanan (TNT) JHEAIPP';
var SESI_TTL_SAAT = 6 * 60 * 60; // had maksimum CacheService

var ROLE = { PENGGUNA: 'pengguna', ADMIN: 'admin' };

var TAB = {
  PENGGUNA: 'Pengguna',
  PROFIL: 'Profil',
  TUNTUTAN: 'Tuntutan',
  KADAR: 'Kadar',
  KUMPULAN: 'KumpulanGred',
  TETAPAN: 'Tetapan',
  LOG: 'LogAudit'
};

var HEADER = {
  Pengguna: ['emel', 'nama', 'salt', 'hash', 'role', 'aktif', 'dicipta_pada', 'log_masuk_terakhir'],
  Profil: ['emel', 'nama', 'ic', 'jawatan', 'gred', 'no_akaun', 'bank', 'telefon', 'gaji', 'elaun',
    'kereta_model', 'kereta_no', 'moto_model', 'moto_no', 'alamat_rumah', 'dikemaskini_pada'],
  Tuntutan: ['id', 'emel', 'bulan', 'data', 'jumlah', 'dicipta_pada', 'dikemaskini_pada', 'dicetak_pada'],
  Kadar: ['id', 'kod', 'kumpulan', 'nilai', 'kuat_kuasa', 'rujukan', 'oleh', 'pada'],
  KumpulanGred: ['id', 'nama', 'gred_min', 'gred_maks', 'catatan'],
  Tetapan: ['kunci', 'nilai', 'keterangan'],
  LogAudit: ['masa', 'emel', 'tindakan', 'tab', 'rekod', 'butiran']
};

/**
 * Kod kadar. per_kumpulan: nilai berbeza ikut kumpulan gred (diisi admin).
 * Kadar kenderaan sama untuk semua pegawai.
 */
var KOD_KADAR = {
  AMBANG_KM: { label: 'Had peringkat pertama mileage (km)', unit: 'km', per_kumpulan: false },
  KERETA_1: { label: 'Kereta: kadar peringkat pertama', unit: 'RM/km', per_kumpulan: false },
  KERETA_2: { label: 'Kereta: kadar peringkat seterusnya', unit: 'RM/km', per_kumpulan: false },
  MOTO_1: { label: 'Motosikal: kadar peringkat pertama', unit: 'RM/km', per_kumpulan: false },
  MOTO_2: { label: 'Motosikal: kadar peringkat seterusnya', unit: 'RM/km', per_kumpulan: false },
  ELAUN_MAKAN: { label: 'Elaun makan sehari (Semenanjung)', unit: 'RM', per_kumpulan: true },
  ELAUN_HARIAN: { label: 'Elaun harian sehari (Semenanjung)', unit: 'RM', per_kumpulan: true },
  LOJING: { label: 'Elaun lojing semalam (Semenanjung)', unit: 'RM', per_kumpulan: true }
};

// Peratus bahagian makan (WP1.4): sarapan 20%, tengah hari 40%, malam 40%
var PERATUS_MAKAN = { sarapan: 0.2, tengahari: 0.4, malam: 0.4 };

// Jenis tambang pengangkutan awam ikut susunan baris Muka 5 (baris 4 hingga 9)
var JENIS_AWAM = [
  { kod: 'teksi', label: 'Teksi/Kereta Sewa/e-Panggilan' },
  { kod: 'bas', label: 'Bas' },
  { kod: 'keretapi', label: 'Kereta Api' },
  { kod: 'feri', label: 'Motobot/Feri' },
  { kod: 'kapalterbang', label: 'Kapal Terbang' },
  { kod: 'lain', label: 'Lain-lain' }
];

var TARIKH_ASAS = '2000-01-01';

var LALAI = {
  // Kadar mileage (EPK) Pulau Pinang. Tarikh kuat kuasa di sini = 1hb BULAN TUNTUTAN pertama yang terpakai.
  // Surat JKN 24/04/2026: kadar baharu berkuat kuasa 1 Mei 2026 bagi tuntutan bulan April 2026 → 2026-04-01.
  // Kadar sebelum 2026 diambil daripada borang TNT Sept 2025 (kereta sahaja; motosikal tiada data).
  Kadar: [
    ['k1', 'AMBANG_KM', '', '500', TARIKH_ASAS, 'PP WP1.4', 'setup', ''],
    ['k2', 'KERETA_1', '', '0.85', TARIKH_ASAS, 'Borang TNT Sept 2025 (sebelum PP WP1.4 2026)', 'setup', ''],
    ['k3', 'KERETA_2', '', '0.75', TARIKH_ASAS, 'Borang TNT Sept 2025 (sebelum PP WP1.4 2026)', 'setup', ''],
    ['k4', 'KERETA_1', '', '0.90', '2026-01-01', 'JKNPP.100.4/1/4(22) 28/01/2026: PP WP1.4 2026, EPK mulai 1 Jan 2026', 'setup', ''],
    ['k5', 'KERETA_2', '', '0.80', '2026-01-01', 'JKNPP.100.4/1/4(22) 28/01/2026: PP WP1.4 2026, EPK mulai 1 Jan 2026', 'setup', ''],
    ['k6', 'MOTO_1', '', '0.60', '2026-01-01', 'JKNPP.100.4/1/4(22) 28/01/2026: PP WP1.4 2026, EPK mulai 1 Jan 2026', 'setup', ''],
    ['k7', 'MOTO_2', '', '0.50', '2026-01-01', 'JKNPP.100.4/1/4(22) 28/01/2026: PP WP1.4 2026, EPK mulai 1 Jan 2026', 'setup', ''],
    ['k8', 'KERETA_1', '', '1.00', '2026-04-01', 'JKNPP.100.4/1/4 (26) 24/04/2026: kuat kuasa 1 Mei 2026 bagi tuntutan bulan April 2026', 'setup', ''],
    ['k9', 'KERETA_2', '', '0.90', '2026-04-01', 'JKNPP.100.4/1/4 (26) 24/04/2026: kuat kuasa 1 Mei 2026 bagi tuntutan bulan April 2026', 'setup', ''],
    ['k10', 'MOTO_1', '', '0.65', '2026-04-01', 'JKNPP.100.4/1/4 (26) 24/04/2026: kuat kuasa 1 Mei 2026 bagi tuntutan bulan April 2026', 'setup', ''],
    ['k11', 'MOTO_2', '', '0.55', '2026-04-01', 'JKNPP.100.4/1/4 (26) 24/04/2026: kuat kuasa 1 Mei 2026 bagi tuntutan bulan April 2026', 'setup', '']
  ],
  Tetapan: [
    ['DOMAIN_EMEL', 'penang.gov.my', 'Hanya emel domain ini boleh mendaftar (pisahkan dengan koma jika lebih dari satu)'],
    ['ALAMAT_PEJABAT', 'JABATAN HAL EHWAL AGAMA ISLAM PULAU PINANG, 10300 LEBUH PANTAI, PULAU PINANG', 'Alamat pejabat yang dicetak di Muka 1 (huruf besar)'],
    ['TEMPLAT_ID', '', 'ID Google Sheet templat borang (diisi oleh sediakanTemplat)'],
    ['FOLDER_SEMENTARA_ID', '', 'Folder Drive untuk salinan sementara semasa cetak (kosong = My Drive)'],
    ['TEMPOH_SIMPAN_BULAN', '24', 'Tempoh simpan tuntutan (bulan) sebelum boleh dipadam admin']
  ]
};

// ---- Util.js
/**
 * Fungsi utiliti tulen (tiada panggilan Apps Script) supaya boleh diuji di Node.
 */

function teks(v) {
  return v === null || v === undefined ? '' : String(v).trim();
}

/** Nombor daripada input pengguna; kosong/tidak sah → 0. */
function nombor(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  var n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
  return isFinite(n) ? n : 0;
}

function bundar2(n) {
  return Math.round((n + Number.EPSILON) * 100) / 100;
}

/** Neutralkan nilai yang boleh dibaca sebagai formula oleh Sheets/Excel. */
function sanitizeForSheet(value) {
  var str = teks(value);
  if (/^[=+\-@]/.test(str)) return "'" + str;
  return str;
}

/** Papar 4 aksara terakhir sahaja, cth ********5973 */
function samarkan(v) {
  var s = teks(v).replace(/\s/g, '');
  if (!s) return '';
  if (s.length <= 4) return '****';
  return new Array(s.length - 3).join('*') + s.slice(-4);
}

function hanyaDigit(v) {
  return teks(v).replace(/\D/g, '');
}

function sahTarikh(t) {
  return /^\d{4}-\d{2}-\d{2}$/.test(teks(t));
}

function sahBulan(b) {
  return /^\d{4}-(0[1-9]|1[0-2])$/.test(teks(b));
}

/** 'YYYY-MM-DD' → 'DD/MM/YYYY' */
function formatTarikh(t) {
  var s = teks(t);
  if (!sahTarikh(s)) return s;
  return s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4);
}

var NAMA_BULAN = ['JANUARI', 'FEBRUARI', 'MAC', 'APRIL', 'MEI', 'JUN', 'JULAI', 'OGOS',
  'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DISEMBER'];

/** '2026-01' → 'JANUARI 2026' */
function labelBulan(bulan) {
  var b = teks(bulan);
  if (!sahBulan(b)) return b;
  return NAMA_BULAN[parseInt(b.slice(5, 7), 10) - 1] + ' ' + b.slice(0, 4);
}

/** '2026-02' → '2026-02-28' */
function hariAkhirBulan(bulan) {
  var y = +bulan.slice(0, 4), m = +bulan.slice(5, 7);
  var d = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return bulan + '-' + ('0' + d).slice(-2);
}

/** 1234.5 → 'RM1,234.50' */
function ringgit(n) {
  var v = bundar2(nombor(n));
  var bah = v.toFixed(2).split('.');
  return 'RM' + bah[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + bah[1];
}

/** 'N19', 'DG44', 'S 48', 'UD52 (KUP)' → 19, 44, 48, 52. Ambil nombor pertama. */
function nomborGred(gred) {
  var m = /(\d+)/.exec(teks(gred));
  return m ? parseInt(m[1], 10) : NaN;
}

function emelSah(emel) {
  return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(teks(emel));
}

/** domain: 'penang.gov.my' atau 'penang.gov.my, jheaipp.gov.my'. Subdomain tidak diterima. */
function emelDalamDomain(emel, domain) {
  var e = teks(emel).toLowerCase();
  if (!emelSah(e)) return false;
  var d = e.split('@')[1];
  return teks(domain).toLowerCase().split(',').map(teks).filter(Boolean).indexOf(d) >= 0;
}

function masaSah(m) {
  return /^([01]\d|2[0-3]):[0-5]\d$/.test(teks(m));
}

// ---- Kiraan.js
/**
 * Kiraan tuntutan (fungsi tulen, diuji di Node).
 *
 * Kadar dipilih ikut tarikh kuat kuasa: bagi setiap kod, ambil baris dengan kuat_kuasa paling
 * lewat yang <= 1hb bulan tuntutan. Jadi bila pekeliling baharu keluar, admin tambah baris baharu
 * (bukan ubah baris lama) dan tuntutan bulan sebelumnya kekal dikira dengan kadar lama.
 */

var MAKS_PERJALANAN = 80;
var MAKS_TEKS = 300;

function tarikhRujukanKadar(bulan) {
  return bulan + '-01';
}

/** Kumpulan gred yang sepadan dengan nombor gred pegawai, atau null. */
function cariKumpulan(senaraiKumpulan, gred) {
  var n = nomborGred(gred);
  if (isNaN(n)) return null;
  for (var i = 0; i < senaraiKumpulan.length; i++) {
    var k = senaraiKumpulan[i];
    var min = nombor(k.gred_min), maks = teks(k.gred_maks) === '' ? Infinity : nombor(k.gred_maks);
    if (n >= min && n <= maks) return k;
  }
  return null;
}

/** Baris kadar berkuat kuasa pada tarikh, atau null. kumpulan '' untuk kadar umum. */
function kadarPada(senaraiKadar, kod, kumpulan, tarikh) {
  var calon = null;
  for (var i = 0; i < senaraiKadar.length; i++) {
    var r = senaraiKadar[i];
    if (r.kod !== kod || teks(r.kumpulan) !== teks(kumpulan)) continue;
    if (!sahTarikh(r.kuat_kuasa) || r.kuat_kuasa > tarikh) continue;
    if (teks(r.nilai) === '') continue;
    if (!calon || r.kuat_kuasa > calon.kuat_kuasa || (r.kuat_kuasa === calon.kuat_kuasa && teks(r.pada) >= teks(calon.pada))) calon = r;
  }
  return calon;
}

/** Semua kadar yang terpakai bagi bulan dan gred ini. */
function kadarUntuk(konteks, bulan, gred) {
  var tarikh = tarikhRujukanKadar(bulan);
  var kumpulan = cariKumpulan(konteks.kumpulan || [], gred);
  var hasil = { tarikh: tarikh, kumpulan: kumpulan ? kumpulan.nama : '', nilai: {}, rujukan: {}, tiada: [] };
  Object.keys(KOD_KADAR).forEach(function (kod) {
    var def = KOD_KADAR[kod];
    var r = def.per_kumpulan ? (kumpulan ? kadarPada(konteks.kadar, kod, kumpulan.nama, tarikh) : null)
      : kadarPada(konteks.kadar, kod, '', tarikh);
    if (r) {
      hasil.nilai[kod] = nombor(r.nilai);
      hasil.rujukan[kod] = teks(r.rujukan);
    } else {
      hasil.nilai[kod] = 0;
      hasil.tiada.push(kod);
    }
  });
  return hasil;
}

// ---------------------------------------------------------------- Pembersihan input

function potong(v, maks) {
  return teks(v).slice(0, maks || MAKS_TEKS);
}

function amaun(v) {
  return Math.max(0, bundar2(nombor(v)));
}

function bilangan(v) {
  return Math.max(0, Math.floor(nombor(v)));
}

/** Bersihkan data tuntutan daripada klien: buang medan asing, hadkan panjang dan nilai negatif. */
function bersihkanData(d) {
  d = d || {};
  var p = d.pegawai || {};
  var peg = {};
  HEADER.Profil.forEach(function (k) {
    if (k !== 'emel' && k !== 'dikemaskini_pada') peg[k] = potong(p[k]);
  });
  peg.nama = peg.nama.toUpperCase();
  var perjalanan = (Array.isArray(d.perjalanan) ? d.perjalanan : []).slice(0, MAKS_PERJALANAN).map(function (r) {
    r = r || {};
    var k = teks(r.kenderaan).toUpperCase();
    return {
      tarikh: sahTarikh(r.tarikh) ? r.tarikh : '',
      bertolak: masaSah(r.bertolak) ? r.bertolak : '',
      tiba: masaSah(r.tiba) ? r.tiba : '',
      butiran: potong(r.butiran, 600),
      jarak: Math.max(0, Math.round(nombor(r.jarak) * 10) / 10),
      kenderaan: ['KERETA', 'MOTOSIKAL', 'TIADA'].indexOf(k) >= 0 ? k : 'KERETA'
    };
  }).filter(function (r) { return r.tarikh || r.butiran || r.jarak; });
  var m = d.makan || {};
  var l = d.lojing || {};
  var awam = {};
  JENIS_AWAM.forEach(function (j) {
    var a = (d.awam || {})[j.kod] || {};
    awam[j.kod] = { rm: amaun(a.rm), resit: potong(a.resit, 120) };
  });
  return {
    bulan: sahBulan(d.bulan) ? d.bulan : '',
    pegawai: peg,
    perjalanan: perjalanan,
    makan: {
      sarapan: bilangan(m.sarapan), tengahari: bilangan(m.tengahari), malam: bilangan(m.malam),
      hari_makan: bilangan(m.hari_makan), hari_harian: bilangan(m.hari_harian)
    },
    lojing: {
      malam: bilangan(l.malam),
      senarai: (Array.isArray(l.senarai) ? l.senarai : []).slice(0, 2).map(function (x) {
        x = x || {};
        return { tarikh: potong(x.tarikh, 80), alamat: potong(x.alamat, 200) };
      })
    },
    bsp: (Array.isArray(d.bsp) ? d.bsp : []).slice(0, 2).map(function (x) {
      x = x || {};
      return { kadar: amaun(x.kadar), hari: bilangan(x.hari), resit: potong(x.resit, 120) };
    }),
    awam: awam,
    tol: { rm: amaun((d.tol || {}).rm), rujukan: potong((d.tol || {}).rujukan, 120) },
    parkir: { rm: amaun((d.parkir || {}).rm), rujukan: potong((d.parkir || {}).rujukan, 120) },
    pengakuan: {
      tanpa_resit: amaun((d.pengakuan || {}).tanpa_resit),
      resit_bukan_nama: amaun((d.pengakuan || {}).resit_bukan_nama),
      tarikh: sahTarikh((d.pengakuan || {}).tarikh) ? d.pengakuan.tarikh : ''
    },
    pendahuluan: amaun(d.pendahuluan)
  };
}

// ---------------------------------------------------------------- Kiraan

function pecahPeringkat(km, ambang) {
  var t1 = Math.min(km, ambang);
  return [t1, Math.max(0, km - ambang)];
}

/**
 * data: hasil bersihkanData. konteks: { kadar: [...], kumpulan: [...] }.
 * Pulangkan semua angka yang dicetak serta amaran untuk pengguna.
 */
function kiraTuntutan(data, konteks) {
  var k = kadarUntuk(konteks, data.bulan, data.pegawai.gred);
  var v = k.nilai;
  var amaran = [];

  // C: mileage
  var kmKereta = 0, kmMoto = 0, jumlahKm = 0;
  data.perjalanan.forEach(function (r) {
    jumlahKm += r.jarak;
    if (r.kenderaan === 'KERETA') kmKereta += r.jarak;
    else if (r.kenderaan === 'MOTOSIKAL') kmMoto += r.jarak;
    if (r.tarikh && r.tarikh.slice(0, 7) !== data.bulan) amaran.push('Perjalanan ' + formatTarikh(r.tarikh) + ' bukan dalam bulan tuntutan.');
  });
  kmKereta = Math.round(kmKereta * 10) / 10;
  kmMoto = Math.round(kmMoto * 10) / 10;
  var ambang = v.AMBANG_KM || 500;
  var pk = pecahPeringkat(kmKereta, ambang), pm = pecahPeringkat(kmMoto, ambang);
  var mileage = {
    kereta_1: { km: pk[0], kadar: v.KERETA_1, rm: bundar2(pk[0] * v.KERETA_1) },
    kereta_2: { km: pk[1], kadar: v.KERETA_2, rm: bundar2(pk[1] * v.KERETA_2) },
    moto_1: { km: pm[0], kadar: v.MOTO_1, rm: bundar2(pm[0] * v.MOTO_1) },
    moto_2: { km: pm[1], kadar: v.MOTO_2, rm: bundar2(pm[1] * v.MOTO_2) }
  };
  mileage.jumlah = bundar2(mileage.kereta_1.rm + mileage.kereta_2.rm + mileage.moto_1.rm + mileage.moto_2.rm);
  var awamJumlah = 0;
  JENIS_AWAM.forEach(function (j) { awamJumlah += data.awam[j.kod].rm; });
  awamJumlah = bundar2(awamJumlah);
  var C = { mileage: mileage, awam: awamJumlah, jumlah: bundar2(mileage.jumlah + awamJumlah) };

  // A: makan minum
  var em = v.ELAUN_MAKAN, eh = v.ELAUN_HARIAN, m = data.makan;
  function bahagian(nama, bil) {
    var kadar = bundar2(em * PERATUS_MAKAN[nama]);
    return { kadar: kadar, bil: bil, rm: bundar2(kadar * bil) };
  }
  var A = {
    sarapan: bahagian('sarapan', m.sarapan),
    tengahari: bahagian('tengahari', m.tengahari),
    malam: bahagian('malam', m.malam),
    makan_penuh: { kadar: em, hari: m.hari_makan, rm: bundar2(em * m.hari_makan) },
    harian: { kadar: eh, hari: m.hari_harian, rm: bundar2(eh * m.hari_harian) }
  };
  A.jumlah_bahagian = bundar2(A.sarapan.rm + A.tengahari.rm + A.malam.rm);
  A.jumlah = bundar2(A.jumlah_bahagian + A.makan_penuh.rm + A.harian.rm);
  var gunaMakan = m.sarapan + m.tengahari + m.malam + m.hari_makan > 0;
  if (gunaMakan && !em) amaran.push('Kadar elaun makan belum ditetapkan admin untuk gred ' + (data.pegawai.gred || '(kosong)') + '.');
  if (m.hari_harian > 0 && !eh) amaran.push('Kadar elaun harian belum ditetapkan admin untuk gred ' + (data.pegawai.gred || '(kosong)') + '.');

  // B: penginapan
  var bsp = data.bsp.map(function (x) { return { kadar: x.kadar, hari: x.hari, resit: x.resit, rm: bundar2(x.kadar * x.hari) }; });
  var bspJumlah = bundar2(bsp.reduce(function (s, x) { return s + x.rm; }, 0));
  var lj = { kadar: v.LOJING, malam: data.lojing.malam, rm: bundar2(v.LOJING * data.lojing.malam) };
  if (lj.malam > 0 && !lj.kadar) amaran.push('Kadar elaun lojing belum ditetapkan admin untuk gred ' + (data.pegawai.gred || '(kosong)') + '.');
  var B = { bsp: bsp, bsp_jumlah: bspJumlah, lojing: lj, jumlah: bundar2(bspJumlah + lj.rm) };

  // D: lain-lain (tol dan parkir dalam Belanja Pelbagai)
  var pelbagai = bundar2(data.tol.rm + data.parkir.rm);
  var D = { tol: data.tol.rm, parkir: data.parkir.rm, pelbagai: pelbagai, jumlah: pelbagai };

  if ((kmKereta > 0 && (!v.KERETA_1 || (pk[1] > 0 && !v.KERETA_2))) || (kmMoto > 0 && (!v.MOTO_1 || (pm[1] > 0 && !v.MOTO_2)))) {
    amaran.push('Kadar mileage belum ditetapkan admin.');
  }
  if (!k.kumpulan && (gunaMakan || m.hari_harian > 0 || lj.malam > 0)) {
    amaran.push('Gred "' + (data.pegawai.gred || '') + '" tidak sepadan dengan mana-mana kumpulan gred. Maklumkan admin.');
  }
  if (kmKereta > 0 && !data.pegawai.kereta_no) amaran.push('No. pendaftaran kereta belum diisi dalam profil.');
  if (kmMoto > 0 && !data.pegawai.moto_no) amaran.push('No. pendaftaran motosikal belum diisi dalam profil.');

  var jumlah = bundar2(A.jumlah + B.jumlah + C.jumlah + D.jumlah);
  return {
    kadar: k, amaran: amaran,
    km: { kereta: kmKereta, moto: kmMoto, jumlah: Math.round(jumlahKm * 10) / 10 },
    A: A, B: B, C: C, D: D,
    jumlah: jumlah,
    pendapatan: bundar2(nombor(data.pegawai.gaji) + nombor(data.pegawai.elaun)),
    pendahuluan: data.pendahuluan ? { diberi: data.pendahuluan, baki: bundar2(data.pendahuluan - jumlah) } : null
  };
}

// ---- ImportBorang.js
/**
 * Import borang TNT lama (.xlsx) ke dalam format data sistem. Fungsi tulen; dijalankan di pelayar
 * (fail tidak dihantar ke server atau disimpan dalam Drive). Pengguna semak dalam editor sebelum simpan.
 *
 * Input: { 'Nama helaian': { A1: nilai, ... } }. Tarikh Excel boleh datang sebagai nombor siri.
 * Dua format disokong:
 *  - WP1.4 2026 (helaian "Muka 1".."Muka 7", sama dengan templat sistem)
 *  - Borang 2024 (helaian "MUKA SURAT 1".."MUKA SURAT 6", Lampiran C)
 * Pulangkan { format, data, nota: [] }. Nota menerangkan perkara yang diabaikan atau berbeza.
 */

var BULAN_MELAYU = { JANUARI: 1, FEBRUARI: 2, MAC: 3, APRIL: 4, MEI: 5, JUN: 6, JULAI: 7, OGOS: 8, SEPTEMBER: 9,
  OKTOBER: 10, NOVEMBER: 11, DISEMBER: 12 };

function selNilai(helaian, alamat) {
  var v = helaian ? helaian[alamat] : undefined;
  return v === undefined || v === null ? '' : v;
}

function selTeks(helaian, alamat) {
  return teks(selNilai(helaian, alamat)).replace(/\s+/g, ' ');
}

/** 'Nama (Huruf Besar)  : ALI' → 'ALI'; ': S9' → 'S9' */
function selepasTitikBertindih(s) {
  var t = teks(s);
  var i = t.indexOf(':');
  return teks(i >= 0 ? t.slice(i + 1) : t);
}

/** 'Jenis/ Model: Perodua Kelisa' → 'Perodua Kelisa' (label templat dibuang). */
function buangLabel(s, label) {
  var t = teks(s);
  var re = new RegExp('^\\s*' + label.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&') + '\\s*:?\\s*', 'i');
  return teks(t.replace(re, ''));
}

/** Nombor daripada 'RM 37.32', ': 2281', 37.32. Tiada nombor → 0. */
function amaunTeks(v) {
  if (typeof v === 'number') return v;
  var m = /-?\d[\d,]*(\.\d+)?/.exec(teks(v));
  return m ? parseFloat(m[0].replace(/,/g, '')) : 0;
}

function pad2(n) { return ('0' + n).slice(-2); }

/** Nombor siri Excel / ISO / 'd/m/yy' / 'd/m/yyyy' → 'YYYY-MM-DD', atau '' */
function tarikhImport(v) {
  if (typeof v === 'number' && v > 20000 && v < 80000) {
    var d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }
  var s = teks(v);
  var iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
  if (iso) return iso[1] + '-' + iso[2] + '-' + iso[3];
  var m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/.exec(s);
  if (m) {
    var y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
    var mo = +m[2], da = +m[1];
    if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) return y + '-' + pad2(mo) + '-' + pad2(da);
  }
  return '';
}

/** '2.15 PM', '01.40 pm', '10.00 pm', '7:40', 0.5 (pecahan hari) → 'HH:MM', atau '' */
function masaImport(v) {
  if (typeof v === 'number' && v >= 0 && v < 1) {
    var min = Math.round(v * 1440);
    return pad2(Math.floor(min / 60) % 24) + ':' + pad2(min % 60);
  }
  var m = /^(\d{1,2})[.:](\d{2})\s*(am|pm|a\.m\.|p\.m\.|pagi|petang|malam)?$/i.exec(teks(v).replace(/\s+/g, ' '));
  if (!m) return '';
  var j = +m[1], n = +m[2], ap = (m[3] || '').toLowerCase().replace(/\./g, '');
  if (n > 59) return '';
  if (ap === 'pm' || ap === 'petang' || ap === 'malam') { if (j < 12) j += 12; }
  else if ((ap === 'am' || ap === 'pagi') && j === 12) j = 0;
  if (j > 23) return '';
  return pad2(j) + ':' + pad2(n);
}

/** Bulan yang paling kerap dalam tarikh perjalanan; jika tiada, guna label 'BAGI BULAN'. */
function tentukanBulan(perjalanan, labelBulanFail) {
  var kira = {};
  perjalanan.forEach(function (r) { if (r.tarikh) kira[r.tarikh.slice(0, 7)] = (kira[r.tarikh.slice(0, 7)] || 0) + 1; });
  var terbaik = '', maks = 0;
  Object.keys(kira).forEach(function (b) { if (kira[b] > maks) { maks = kira[b]; terbaik = b; } });
  var dariLabel = '';
  var m = /(JANUARI|FEBRUARI|MAC|APRIL|MEI|JUN|JULAI|OGOS|SEPTEMBER|OKTOBER|NOVEMBER|DISEMBER)\s+(\d{4})/i.exec(teks(labelBulanFail));
  if (m) dariLabel = m[2] + '-' + pad2(BULAN_MELAYU[m[1].toUpperCase()]);
  return { bulan: terbaik || dariLabel, dariLabel: dariLabel };
}

/** Baca baris kenyataan tuntutan sehingga baris 'JUMLAH'. */
function bacaPerjalanan(h, mula, nota, kenderaanLalai) {
  var hasil = [];
  for (var r = mula; r < mula + 200; r++) {
    var a = selNilai(h, 'A' + r);
    if (/^JUMLAH/i.test(teks(a))) break;
    var butiran = selTeks(h, 'D' + r), jarak = amaunTeks(selNilai(h, 'E' + r));
    if (!teks(a) && !butiran && !jarak) continue;
    var tarikh = tarikhImport(a);
    if (teks(a) && !tarikh) {
      // cth '1 Ogos hingga 30 Ogos 2026' bagi baris parkir: simpan dalam butiran
      butiran = teks(butiran + ' (' + teks(a) + ')');
    }
    var bertolak = masaImport(selNilai(h, 'B' + r)), tiba = masaImport(selNilai(h, 'C' + r));
    if (teks(selNilai(h, 'B' + r)) && !bertolak) nota.push('Masa bertolak "' + teks(selNilai(h, 'B' + r)) + '" (baris ' + r + ') tidak dapat dibaca.');
    if (teks(selNilai(h, 'C' + r)) && !tiba) nota.push('Masa tiba "' + teks(selNilai(h, 'C' + r)) + '" (baris ' + r + ') tidak dapat dibaca.');
    hasil.push({ tarikh: tarikh, bertolak: bertolak, tiba: tiba, butiran: butiran, jarak: jarak,
      kenderaan: jarak ? kenderaanLalai : 'TIADA' });
  }
  return hasil;
}

function kenderaanLalai(peg) {
  return !peg.kereta_no && peg.moto_no ? 'MOTOSIKAL' : 'KERETA';
}

function semakBulan(data, bulanInfo, nota) {
  if (bulanInfo.dariLabel && bulanInfo.bulan && bulanInfo.dariLabel !== bulanInfo.bulan) {
    nota.push('Label "Bagi bulan" dalam fail ialah ' + labelBulan(bulanInfo.dariLabel) + ', tetapi kebanyakan tarikh perjalanan dalam '
      + labelBulan(bulanInfo.bulan) + '. Bulan tuntutan ditetapkan ' + labelBulan(bulanInfo.bulan) + '.');
  }
  data.perjalanan.forEach(function (r) {
    if (r.tarikh && r.tarikh.slice(0, 7) !== data.bulan) nota.push('Tarikh ' + formatTarikh(r.tarikh) + ' bukan dalam bulan tuntutan. Mungkin silap taip; semak.');
  });
}

function jumlahKm(perjalanan) {
  return Math.round(perjalanan.reduce(function (s, r) { return s + r.jarak; }, 0) * 10) / 10;
}

// ---------------------------------------------------------------- Format WP1.4 2026 (Muka 1-7)

function importFormat2026(b) {
  var nota = [];
  var m1 = b['Muka 1'] || {}, m2 = b['Muka 2'] || {}, m3 = b['Muka 3'] || {}, m4 = b['Muka 4'] || {};
  var m5 = b['Muka 5'] || {}, m6 = b['Muka 6'] || {}, m7 = b['Muka 7'] || {};
  var peg = {
    nama: selTeks(m1, 'C9'), ic: selTeks(m1, 'C10'), jawatan: selTeks(m1, 'C11'), gred: selTeks(m1, 'C12'),
    no_akaun: selTeks(m1, 'C13'), bank: selTeks(m1, 'C14'), telefon: selTeks(m1, 'C15'),
    gaji: selNilai(m1, 'E16') === '' ? '' : String(amaunTeks(selNilai(m1, 'E16'))),
    elaun: selNilai(m1, 'E17') === '' ? '' : String(amaunTeks(selNilai(m1, 'E17'))),
    kereta_model: buangLabel(selTeks(m1, 'C20'), 'Jenis/ Model'), moto_model: buangLabel(selTeks(m1, 'F20'), 'Jenis/ Model'),
    kereta_no: buangLabel(selTeks(m1, 'C21'), 'No. Pendaftaran'), moto_no: buangLabel(selTeks(m1, 'F21'), 'No. Pendaftaran'),
    alamat_rumah: selTeks(m1, 'C23')
  };
  var perjalanan = bacaPerjalanan(m2, 6, nota, kenderaanLalai(peg));
  var bulanInfo = tentukanBulan(perjalanan, selTeks(m1, 'E6'));

  // A: kadar elaun ikut admin; hanya bilangan diimport. Bilangan tanpa kadar dalam fail = nilai lalai templat.
  var bil = function (kadarSel, bilSel) { return amaunTeks(selNilai(m3, kadarSel)) ? amaunTeks(selNilai(m3, bilSel)) : 0; };
  var makan = { sarapan: bil('C7', 'D7'), tengahari: bil('C8', 'D8'), malam: bil('C9', 'D9'),
    hari_makan: bil('B11', 'D11'), hari_harian: bil('B13', 'D13') };

  // B: BSP dikira jika lajur jumlah (G) ada nilai; jika G dikosongkan, baris dianggap tidak dituntut
  var bsp = [];
  [['20', '22'], ['23', '25']].forEach(function (x) {
    var kadar = amaunTeks(selNilai(m3, 'B' + x[0])), hari = amaunTeks(selNilai(m3, 'D' + x[0]));
    var g = selNilai(m3, 'G' + x[0]);
    if (!kadar) return;
    if (g === '' || amaunTeks(g) === 0) {
      nota.push('Bayaran sewa hotel RM' + kadar.toFixed(2) + ' (Muka 3 baris ' + x[0] + ') tidak diimport kerana jumlahnya kosong dalam fail. Tambah sendiri jika memang dituntut.');
      return;
    }
    var resit = /Resit\s*:?\s*([^\]…\.][^\]]*)\]/i.exec(selTeks(m3, 'A' + x[1]));
    bsp.push({ kadar: kadar, hari: hari || 1, resit: resit ? teks(resit[1]) : '' });
  });
  var lojingMalam = amaunTeks(selNilai(m4, 'B5')) ? amaunTeks(selNilai(m4, 'D5')) : 0;
  var senaraiLojing = [['A7', 'A8'], ['A9', 'A10']].map(function (x) {
    return { tarikh: buangLabel(selTeks(m4, x[0]), 'Tarikh Lojing'), alamat: buangLabel(selTeks(m4, x[1]), 'Alamat Lojing') };
  });

  // C: mileage dikira semula daripada perjalanan; bandingkan dengan fail
  var kmFail = amaunTeks(selNilai(m4, 'G18')) + amaunTeks(selNilai(m4, 'G19'));
  var km = jumlahKm(perjalanan.filter(function (r) { return r.kenderaan === 'KERETA'; }));
  if (kmFail && Math.abs(kmFail - km) > 0.05) {
    nota.push('Jarak kereta di Muka 4 dalam fail ialah ' + kmFail + ' km, tetapi jumlah perjalanan ialah ' + km + ' km. Sistem guna jumlah perjalanan.');
  }
  var kadarFail = amaunTeks(selNilai(m4, 'I18'));
  if (kadarFail) nota.push('Kadar mileage kereta dalam fail: RM' + kadarFail.toFixed(2) + '/km. Sistem guna kadar admin yang berkuat kuasa pada bulan tuntutan.');
  var awam = {};
  JENIS_AWAM.forEach(function (j, i) {
    var resit = /Resit\s*:?\s*([^\]…\.][^\]]*)\]/i.exec(selTeks(m5, 'A' + (4 + i)));
    awam[j.kod] = { rm: amaunTeks(selNilai(m5, 'L' + (4 + i))), resit: resit ? teks(resit[1]) : '' };
  });
  var rujukan = function (s) { var m = /:\s*([^\]…]+)\]/.exec(s); return m ? teks(m[1]) : ''; };

  // D: hanya tol dan parkir disokong; lain-lain dilaporkan
  [['Muka 5', m5, 28, 32], ['Muka 6', m6, 4, 7]].forEach(function (x) {
    for (var r = x[2]; r <= x[3]; r++) {
      var v = amaunTeks(selNilai(x[1], 'L' + r));
      if (v) nota.push('"' + selTeks(x[1], 'A' + r).split('[')[0].trim() + '" RM' + v.toFixed(2) + ' (' + x[0] + ') tidak disokong sistem dan tidak diimport.');
    }
  });
  if (amaunTeks(selNilai(m5, 'L21')) || amaunTeks(selNilai(m5, 'L26')) || amaunTeks(selNilai(m6, 'E16')) || amaunTeks(selNilai(m6, 'L16'))) {
    nota.push('Ada tuntutan pemandu atau elaun gantian tetap dalam fail. Bahagian ini tidak disokong sistem.');
  }

  var data = {
    bulan: bulanInfo.bulan, pegawai: peg, perjalanan: perjalanan, makan: makan,
    lojing: { malam: lojingMalam, senarai: senaraiLojing }, bsp: bsp, awam: awam,
    tol: { rm: amaunTeks(selNilai(m6, 'L3')), rujukan: rujukan(selTeks(m6, 'A3')) },
    parkir: { rm: amaunTeks(selNilai(m5, 'L33')), rujukan: rujukan(selTeks(m5, 'A33')) },
    pengakuan: { tanpa_resit: amaunTeks(selNilai(m6, 'G28')), resit_bukan_nama: amaunTeks(selNilai(m6, 'I31')), tarikh: tarikhImport(selNilai(m6, 'B40')) },
    pendahuluan: amaunTeks(selNilai(m7, 'G23'))
  };
  semakBulan(data, bulanInfo, nota);
  return { format: 'WP1.4 (Muka 1-7)', data: data, nota: nota, jumlahFail: amaunTeks(selNilai(m6, 'L18')), alamatPejabat: selTeks(m1, 'C22') };
}

// ---------------------------------------------------------------- Format 2024 (MUKA SURAT 1-6)

function importFormat2024(b) {
  var nota = [];
  var s1 = b['MUKA SURAT 1'] || {}, s2 = b['MUKA SURAT 2'] || {}, s3 = b['MUKA SURAT 3'] || {};
  var s4 = b['MUKA SURAT 4'] || {}, s5 = b['MUKA SURAT 5'] || {};
  var gaji = selepasTitikBertindih(selTeks(s1, 'D11')), elaun = selepasTitikBertindih(selTeks(s1, 'D12'));
  var peg = {
    nama: selepasTitikBertindih(selTeks(s1, 'A4')), ic: selepasTitikBertindih(selTeks(s1, 'A5')),
    jawatan: selepasTitikBertindih(selTeks(s1, 'B6')), gred: selepasTitikBertindih(selTeks(s1, 'B7')),
    no_akaun: selepasTitikBertindih(selTeks(s1, 'B8')), bank: selepasTitikBertindih(selTeks(s1, 'B9')),
    telefon: selepasTitikBertindih(selTeks(s1, 'A10')),
    gaji: gaji ? String(amaunTeks(gaji)) : '', elaun: elaun ? String(amaunTeks(elaun)) : '',
    kereta_model: buangLabel(selTeks(s1, 'C15'), 'Jenis/ Model'), moto_model: buangLabel(selTeks(s1, 'E15'), 'Jenis/ Model'),
    kereta_no: buangLabel(selTeks(s1, 'C16'), 'No. Pendaftaran'), moto_no: buangLabel(selTeks(s1, 'E16'), 'No. Pendaftaran'),
    alamat_rumah: selTeks(s1, 'C18')
  };
  var perjalanan = bacaPerjalanan(s2, 4, nota, kenderaanLalai(peg));
  var bulanInfo = tentukanBulan(perjalanan, selTeks(s1, 'A2'));

  var kadarFail = selTeks(s3, 'G4');
  if (amaunTeks(kadarFail)) nota.push('Kadar mileage kereta dalam fail: RM' + amaunTeks(kadarFail).toFixed(2) + '/km. Sistem guna kadar admin yang berkuat kuasa pada bulan tuntutan.');
  var kmFail = amaunTeks(selNilai(s3, 'D4')) + amaunTeks(selNilai(s3, 'D5'));
  var km = jumlahKm(perjalanan.filter(function (r) { return r.kenderaan === 'KERETA'; }));
  if (kmFail && Math.abs(kmFail - km) > 0.05) nota.push('Jarak kereta dalam fail ' + kmFail + ' km, jumlah perjalanan ' + km + ' km. Sistem guna jumlah perjalanan.');

  // Bahagian makan, hotel dan lojing format 2024 berbentuk teks bebas; hanya dilaporkan jika ada amaun
  ['E19', 'E20', 'E21', 'E22', 'N19', 'N20', 'N21', 'N22'].forEach(function (a) {
    if (amaunTeks(selNilai(s3, a))) nota.push('Ada amaun elaun makan dalam fail (MUKA SURAT 3 ' + a + '). Isi semula di bahagian A.');
  });
  ['B3', 'B4', 'B6', 'F3', 'F4', 'F6'].forEach(function (a) {
    if (amaunTeks(selNilai(s4, a))) nota.push('Ada amaun hotel/lojing dalam fail (MUKA SURAT 4 ' + a + '). Isi semula di bahagian B.');
  });
  var awamBaris = { 10: 'teksi', 11: 'bas', 12: 'keretapi', 13: 'feri', 14: 'lain' };
  var awam = {};
  JENIS_AWAM.forEach(function (j) { awam[j.kod] = { rm: 0, resit: '' }; });
  Object.keys(awamBaris).forEach(function (r) {
    var v = amaunTeks(selNilai(s3, 'L' + r)) || amaunTeks(selTeks(s3, 'K' + r).replace(/^RM\s*$/, ''));
    if (v) awam[awamBaris[r]].rm = v;
  });
  var parkir = amaunTeks(selTeks(s5, 'B8')), tol = amaunTeks(selTeks(s5, 'B9'));
  [3, 4, 5, 6, 7, 10, 11].forEach(function (r) {
    var v = amaunTeks(selTeks(s5, 'B' + r));
    if (v) nota.push('"' + selTeks(s5, 'A' + r).split('[')[0].trim() + '" RM' + v.toFixed(2) + ' tidak disokong sistem dan tidak diimport.');
  });

  var data = {
    bulan: bulanInfo.bulan, pegawai: peg, perjalanan: perjalanan,
    makan: { sarapan: 0, tengahari: 0, malam: 0, hari_makan: 0, hari_harian: 0 },
    lojing: { malam: 0, senarai: [] }, bsp: [], awam: awam,
    tol: { rm: tol, rujukan: '' }, parkir: { rm: parkir, rujukan: '' },
    pengakuan: { tanpa_resit: 0, resit_bukan_nama: 0, tarikh: '' }, pendahuluan: 0
  };
  semakBulan(data, bulanInfo, nota);
  return { format: 'Borang 2024 (Lampiran C)', data: data, nota: nota, jumlahFail: amaunTeks(selTeks(s5, 'B13')), alamatPejabat: selTeks(s1, 'C17') };
}

function importBorang(buku) {
  if (buku['Muka 1'] && buku['Muka 2']) return importFormat2026(buku);
  if (buku['MUKA SURAT 1'] && buku['MUKA SURAT 2']) return importFormat2024(buku);
  throw new Error('Format fail tidak dikenali. Hanya borang TNT WP1.4 (helaian "Muka 1"…) atau borang 2024 ("MUKA SURAT 1"…) disokong.');
}

</script>
<script>
const S = { token: null, boot: null, tab: 'tuntutan' };

// ------------------------------------------------------------ Utiliti DOM

function el(tag, props, ...anak) {
  const n = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (k === 'value' || k === 'checked' || k === 'disabled') n[k] = v;
      else n.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of anak.flat()) {
    if (c === null || c === undefined || c === false) continue;
    n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return n;
}
/** append() asli menukar null kepada teks "null"; fungsi ini abaikan null/false. */
function letak(n, ...anak) {
  for (const c of anak.flat()) if (c !== null && c !== undefined && c !== false) n.append(c);
  return n;
}
const kosongkan = (n) => { while (n.firstChild) n.removeChild(n.firstChild); return n; };
function medan(label, input, bantuan, penuh) {
  return el('label', { class: 'medan' + (penuh ? ' penuh' : '') }, label, input, bantuan ? el('span', { class: 'bantuan' }, bantuan) : null);
}
function beritahu(mesej, ralat) {
  const d = el('div', { class: ralat ? 'ralat' : '' }, mesej);
  document.getElementById('toast').append(d);
  setTimeout(() => d.remove(), ralat ? 8000 : 3500);
}
function simpanToken(t) {
  try { t ? sessionStorage.setItem('tnt_token', t) : sessionStorage.removeItem('tnt_token'); } catch (e) { /* storan disekat */ }
}
function bacaToken() {
  try { return sessionStorage.getItem('tnt_token'); } catch (e) { return null; }
}
function jalan(fn, ...args) {
  return new Promise((res, rej) => {
    const r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    r[fn].apply(r, args);
  });
}
const mesejRalat = (err) => String((err && err.message) || err).replace(/^Error:\s*/, '');
async function api(fn, ...args) {
  try {
    return await jalan(fn, S.token, ...args);
  } catch (err) {
    const m = mesejRalat(err);
    if (/Unauthorized/.test(m)) { S.token = null; simpanToken(null); paparLogMasuk('Sesi tamat. Sila log masuk semula.'); }
    throw new Error(m);
  }
}
async function tindakan(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { beritahu(mesejRalat(e), true); }
  finally { if (btn) btn.disabled = false; }
}
const rm = (n) => 'RM' + (Number(n) || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const bulanIni = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const hariIni = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const salin = (o) => JSON.parse(JSON.stringify(o));

function muatTurun(r) {
  const bin = atob(r.base64);
  const bait = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bait[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([bait], { type: 'application/pdf' }));
  const a = el('a', { href: url, download: r.nama, target: '_blank', rel: 'noopener' }, 'Buka PDF');
  document.body.append(a);
  setTimeout(() => { a.click(); a.remove(); }, 0);
}

async function cetak(btn, id) {
  await tindakan(btn, async () => {
    const asal = btn ? btn.textContent : '';
    if (btn) btn.textContent = 'Menjana PDF...';
    try {
      const r = await api('apiCetak', id);
      muatTurun(r);
      beritahu('PDF sedia. Cetak pada kertas A4.');
    } finally { if (btn) btn.textContent = asal; }
  });
}

const notisPrivasi = () => el('p', { class: 'notis-privasi' },
  'Notis privasi: sistem ini menyimpan nama, no. kad pengenalan, no. akaun bank, pendapatan, kenderaan dan alamat anda semata-mata untuk ',
  'menyediakan borang tuntutan perjalanan WP1.4. Data disimpan dalam Google Sheet JHEAIPP yang tidak dikongsi, hanya boleh dilihat oleh anda dan admin sistem, ',
  'dan disimpan mengikut tempoh simpanan rekod kewangan jabatan. Hubungi admin untuk semak atau padam data anda.');

// ------------------------------------------------------------ Log masuk / daftar

async function paparLogMasuk(mesej, mod) {
  mod = mod || 'masuk';
  const app = kosongkan(document.getElementById('app'));
  const kad = el('div', { class: 'kad' });
  letak(app, el('div', { class: 'log-masuk' }, kad, notisPrivasi()));
  let domain = 'penang.gov.my';
  jalan('apiDomain').then((d) => { domain = d; const b = document.getElementById('domain'); if (b) b.textContent = '@' + d.split(',').map((x) => x.trim()).join(' / @'); }).catch(() => {});
  const emel = el('input', { type: 'email', autocomplete: 'username', placeholder: 'nama@penang.gov.my' });
  const kata = el('input', { type: 'password', autocomplete: mod === 'masuk' ? 'current-password' : 'new-password' });
  const tajuk = { masuk: 'Log masuk', daftar: 'Daftar akaun', sahkan: 'Sahkan emel', lupa: 'Lupa kata laluan', setsemula: 'Set semula kata laluan' }[mod];
  letak(kad, el('h2', null, 'Tuntutan Perjalanan (TNT) WP1.4'), el('div', { class: 'bantuan' }, 'Jabatan Hal Ehwal Agama Islam Negeri Pulau Pinang'), el('h3', null, tajuk));
  if (mesej) letak(kad, el('div', { class: 'notis info' }, mesej));

  if (mod === 'masuk') {
    const btn = el('button', { class: 'btn', type: 'submit' }, 'Log masuk');
    const f = el('form', { onsubmit: (e) => { e.preventDefault(); tindakan(btn, async () => {
      const r = await jalan('apiLogMasuk', emel.value, kata.value); masukSesi(r);
    }); } }, medan('Emel', emel), el('p'), medan('Kata laluan', kata), el('p'), btn);
    letak(kad, f, el('div', { class: 'kumpul' },
      el('button', { class: 'pautan', onclick: () => paparLogMasuk('', 'daftar') }, 'Daftar akaun baharu'),
      el('span', { class: 'bantuan' }, '·'),
      el('button', { class: 'pautan', onclick: () => paparLogMasuk('', 'lupa') }, 'Lupa kata laluan')));
  } else if (mod === 'daftar') {
    const nama = el('input', { type: 'text', autocomplete: 'name' });
    const kata2 = el('input', { type: 'password', autocomplete: 'new-password' });
    const btn = el('button', { class: 'btn', type: 'submit' }, 'Hantar kod pengesahan');
    letak(kad, el('p', { class: 'bantuan' }, 'Hanya emel ', el('b', { id: 'domain' }, '@' + domain), ' boleh mendaftar. Kod 6 digit akan dihantar ke emel anda.'),
      el('form', { onsubmit: (e) => { e.preventDefault(); tindakan(btn, async () => {
        if (kata.value !== kata2.value) throw new Error('Kata laluan tidak sepadan.');
        const m = await jalan('apiDaftar', emel.value, nama.value, kata.value);
        S.emelSahkan = emel.value; paparLogMasuk(m, 'sahkan');
      }); } }, medan('Nama penuh (seperti dalam kad pengenalan)', nama), el('p'), medan('Emel rasmi', emel), el('p'),
      medan('Kata laluan', kata, 'Sekurang-kurangnya 8 aksara, ada huruf dan nombor.'), el('p'), medan('Ulang kata laluan', kata2), el('p'), btn),
      el('button', { class: 'pautan', onclick: () => paparLogMasuk('', 'masuk') }, 'Sudah ada akaun? Log masuk'));
  } else if (mod === 'sahkan') {
    const kod = el('input', { type: 'text', inputmode: 'numeric', maxlength: '6', autocomplete: 'one-time-code' });
    const btn = el('button', { class: 'btn', type: 'submit' }, 'Sahkan dan masuk');
    letak(kad, el('form', { onsubmit: (e) => { e.preventDefault(); tindakan(btn, async () => {
      const r = await jalan('apiDaftarSahkan', S.emelSahkan, kod.value); masukSesi(r);
    }); } }, medan('Kod 6 digit dari emel ' + (S.emelSahkan || ''), kod), el('p'), btn),
      el('button', { class: 'pautan', onclick: () => paparLogMasuk('', 'daftar') }, 'Tiada kod? Daftar semula'));
  } else if (mod === 'lupa') {
    const btn = el('button', { class: 'btn', type: 'submit' }, 'Hantar kod');
    letak(kad, el('form', { onsubmit: (e) => { e.preventDefault(); tindakan(btn, async () => {
      const m = await jalan('apiLupa', emel.value); S.emelSahkan = emel.value; paparLogMasuk(m, 'setsemula');
    }); } }, medan('Emel berdaftar', emel), el('p'), btn),
      el('button', { class: 'pautan', onclick: () => paparLogMasuk('', 'masuk') }, 'Kembali ke log masuk'));
  } else if (mod === 'setsemula') {
    const kod = el('input', { type: 'text', inputmode: 'numeric', maxlength: '6', autocomplete: 'one-time-code' });
    const btn = el('button', { class: 'btn', type: 'submit' }, 'Tukar kata laluan');
    letak(kad, el('form', { onsubmit: (e) => { e.preventDefault(); tindakan(btn, async () => {
      const m = await jalan('apiLupaSahkan', S.emelSahkan, kod.value, kata.value); paparLogMasuk(m, 'masuk');
    }); } }, medan('Kod 6 digit dari emel', kod), el('p'), medan('Kata laluan baharu', kata, 'Sekurang-kurangnya 8 aksara, ada huruf dan nombor.'), el('p'), btn),
      el('button', { class: 'pautan', onclick: () => paparLogMasuk('', 'masuk') }, 'Kembali ke log masuk'));
  }
}

function masukSesi(r) {
  S.token = r.token; simpanToken(r.token);
  mula();
}

async function logKeluar() {
  try { await jalan('apiLogKeluar', S.token); } catch (e) { /* abaikan */ }
  S.token = null; simpanToken(null); S.boot = null;
  paparLogMasuk('Anda telah log keluar.');
}

// ------------------------------------------------------------ Rangka utama

async function mula() {
  S.token = S.token || bacaToken();
  if (!S.token) return paparLogMasuk();
  try { S.boot = await api('apiMula'); } catch (e) { return; }
  paparRangka();
}

function paparRangka() {
  const p = S.boot.pengguna;
  const app = kosongkan(document.getElementById('app'));
  const tabs = [['tuntutan', 'Tuntutan saya'], ['profil', 'Profil'], ['akaun', 'Akaun']];
  if (p.role === 'admin') tabs.push(['admin', 'Admin']);
  const nav = el('nav', { class: 'tab' }, tabs.map(([k, l]) => el('button', { class: S.tab === k ? 'aktif' : '', onclick: () => { S.tab = k; paparRangka(); } }, l)));
  S.isi = el('main');
  letak(app, el('header', { class: 'atas' },
    el('div', null, el('h1', null, 'Tuntutan Perjalanan (TNT) WP1.4'), el('div', { class: 'kecil' }, 'JHEAIPP')),
    el('div', { class: 'kumpul' }, el('span', { class: 'kecil' }, p.nama + (p.role === 'admin' ? ' (admin)' : '')), el('button', { onclick: logKeluar }, 'Log keluar'))),
    nav, S.isi, notisPrivasi());
  ({ tuntutan: viewTuntutan, profil: viewProfil, akaun: viewAkaun, admin: viewAdmin })[S.tab]();
}

// ------------------------------------------------------------ Profil

const MEDAN_PROFIL = [
  ['nama', 'Nama (huruf besar)'], ['ic', 'No. kad pengenalan'], ['jawatan', 'Jawatan'], ['gred', 'Gred', 'Cth: S29, N19, DG44'],
  ['no_akaun', 'No. akaun bank'], ['bank', 'Nama bank'], ['telefon', 'No. telefon'],
  ['gaji', 'Gaji (RM)'], ['elaun', 'Elaun-elaun (RM)'],
  ['kereta_model', 'Kereta: jenis/model'], ['kereta_no', 'Kereta: no. pendaftaran'],
  ['moto_model', 'Motosikal: jenis/model'], ['moto_no', 'Motosikal: no. pendaftaran'],

];

function borangPegawai(obj, onubah) {

function viewProfil() {

// ------------------------------------------------------------ Akaun

function viewAkaun() {
  const lama = el('input', { type: 'password', autocomplete: 'current-password' });

  const btn = el('button', { class: 'btn' }, 'Tukar kata laluan');
  btn.onclick = () => tindakan(btn, async () => { beritahu(await api('apiTukarKataLaluan', lama.value, baru.value)); lama.value = baru.value = ''; });

    el('div', { class: 'grid' }, medan('Kata laluan semasa', lama), medan('Kata laluan baharu', baru, 'Sekurang-kurangnya 8 aksara, ada huruf dan nombor.')),
    el('p'), btn));

// ------------------------------------------------------------ Senarai tuntutan

function viewTuntutan() {
  const senarai = S.boot.tuntutan;
  const bulan = el('input', { type: 'month', value: bulanIni() });
  const sumber = el('select', null, el('option', { value: '' }, 'Kosong'),
    senarai.map((t) => el('option', { value: t.id }, 'Salin perjalanan dari ' + t.label)));
  const btnBaru = el('button', { class: 'btn' }, 'Mula tuntutan');
  btnBaru.onclick = () => tindakan(btnBaru, async () => {
    if (!bulan.value) throw new Error('Pilih bulan.');
    const ada = senarai.find((t) => t.bulan === bulan.value);
    if (ada) throw new Error('Tuntutan ' + ada.label + ' sudah ada. Klik "Buka" pada senarai.');
    const d = dataBaru(bulan.value);
    if (sumber.value) {
      const lama = await api('apiBukaTuntutan', sumber.value);
      d.perjalanan = (lama.data.perjalanan || []).map((r) => Object.assign({}, r, { tarikh: '' }));
    }
    bukaEditor(null, d);
  });
  const profilKosong = !S.boot.profil.nama || !S.boot.profil.ic;
  letak(S.isi, 
    profilKosong ? el('div', { class: 'notis amaran' }, 'Profil anda belum lengkap. ', el('button', { class: 'pautan', onclick: () => { S.tab = 'profil'; paparRangka(); } }, 'Isi profil dahulu'), ' supaya Muka 1 borang terisi.') : null,
    el('div', { class: 'kad' }, el('h2', null, 'Tuntutan baharu'),
      el('div', { class: 'grid' }, medan('Bulan tuntutan', bulan), medan('Mula dengan', sumber, 'Salin perjalanan rutin; tarikh dikosongkan.')),
      el('p'), btnBaru),
    kadImport(),
    el('div', { class: 'kad' }, el('h2', null, 'Tuntutan saya'),
      senarai.length ? el('div', { class: 'jadual-skrol' }, el('table', { class: 'data' },
        el('thead', null, el('tr', null, el('th', null, 'Bulan'), el('th', { class: 'nombor' }, 'Jumlah'), el('th', null, 'Dikemaskini'), el('th', null, 'Dicetak'), el('th'))),
        el('tbody', null, senarai.map((t) => {
          const bCetak = el('button', { class: 'btn kecil kedua' }, 'Cetak PDF');
          bCetak.onclick = () => cetak(bCetak, t.id);
          const bBuka = el('button', { class: 'btn kecil' }, 'Buka');
          bBuka.onclick = () => tindakan(bBuka, async () => { const r = await api('apiBukaTuntutan', t.id); bukaEditor(t.id, r.data); });
          const bPadam = el('button', { class: 'btn kecil bahaya' }, 'Padam');
          bPadam.onclick = () => { if (confirm('Padam tuntutan ' + t.label + '?')) tindakan(bPadam, async () => { S.boot.tuntutan = await api('apiPadamTuntutan', t.id); paparRangka(); }); };
          return el('tr', null, el('td', null, t.label), el('td', { class: 'nombor' }, rm(t.jumlah)), el('td', null, t.dikemaskini_pada),
            el('td', null, t.dicetak_pada || '-'), el('td', null, el('div', { class: 'kumpul' }, bBuka, bCetak, bPadam)));
        })))) : el('p', { class: 'kosong' }, 'Belum ada tuntutan.')));
}

// ------------------------------------------------------------ Import borang lama (.xlsx)

const SHEETJS = { src: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  integrity: 'sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw' };

function muatSheetJS() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = el('script', { src: SHEETJS.src, integrity: SHEETJS.integrity, crossorigin: 'anonymous', referrerpolicy: 'no-referrer' });
    s.onload = res;
    s.onerror = () => rej(new Error('Gagal memuatkan pembaca Excel. Semak sambungan internet.'));
    document.head.append(s);
  });
}

/** Fail .xlsx → { helaian: { A1: nilai } }. Tarikh kekal sebagai nombor siri (ditukar oleh importBorang). */
async function bacaXlsx(fail) {
  await muatSheetJS();
  const wb = XLSX.read(await fail.arrayBuffer(), { type: 'array' });
  const buku = {};
  wb.SheetNames.forEach((n) => {
    const sh = wb.Sheets[n], h = {};
    Object.keys(sh).forEach((k) => { if (k[0] !== '!' && sh[k] && sh[k].v !== undefined) h[k] = sh[k].v; });
    buku[n] = h;
  });
  return buku;
}

function kadImport() {
  const fail = el('input', { type: 'file', accept: '.xlsx' });
  const kemas = el('input', { type: 'checkbox', checked: !S.boot.profil.nama || !S.boot.profil.ic, style: 'width:auto' });
  const btn = el('button', { class: 'btn kedua' }, 'Baca fail');
  btn.onclick = () => tindakan(btn, async () => {
    const f = fail.files[0];
    if (!f) throw new Error('Pilih fail .xlsx dahulu.');
    if (f.size > 5 * 1024 * 1024) throw new Error('Fail terlalu besar (had 5 MB).');
    const r = importBorang(await bacaXlsx(f));
    const d = r.data;
    if (d.pegawai.nama && kemas.checked) {
      const prof = Object.assign({}, S.boot.profil);
      MEDAN_PROFIL.forEach(([k]) => { if (d.pegawai[k]) prof[k] = d.pegawai[k]; });
      try {
        S.boot.profil = await api('apiSimpanProfil', prof);
        r.nota.unshift('Profil anda dikemaskini daripada Muka 1 fail ini.');
      } catch (e) { r.nota.unshift('Profil tidak dikemaskini: ' + e.message); }
    }
    // Medan pegawai yang kosong dalam fail diisi daripada profil
    MEDAN_PROFIL.forEach(([k]) => { if (!d.pegawai[k]) d.pegawai[k] = S.boot.profil[k] || ''; });
    if (!d.bulan) { d.bulan = bulanIni(); r.nota.unshift('Bulan tuntutan tidak dapat dikesan. Sila tetapkan bulan.'); }
    if (S.boot.tuntutan.some((t) => t.bulan === d.bulan)) {
      r.nota.unshift('Tuntutan ' + labelBulan(d.bulan) + ' sudah ada dalam sistem. Tukar bulan, atau padam tuntutan lama sebelum simpan.');
    }
    bukaEditor(null, d, { tajuk: 'Diimport daripada ' + f.name + ' (' + r.format + '). Semak, kemudian klik Simpan.', nota: r.nota, jumlahFail: r.jumlahFail });
  });
  return el('div', { class: 'kad' }, el('h2', null, 'Import borang lama (Excel)'),
    el('p', { class: 'bantuan' }, 'Pilih borang TNT yang pernah anda isi dalam Excel (format WP1.4 2026 atau borang 2024). ',
      'Fail dibaca dalam pelayar anda sahaja dan tidak dimuat naik. Hasilnya dibuka dalam editor untuk disemak sebelum disimpan.'),
    el('div', { class: 'grid' }, medan('Fail .xlsx', fail),
      el('label', { class: 'medan', style: 'flex-direction:row;align-items:center;gap:8px' }, kemas, 'Kemaskini profil saya dengan Muka 1 fail ini')),
    el('p'), btn);
}

function dataBaru(bulan) {
  const p = S.boot.profil;
  const peg = {};
  MEDAN_PROFIL.forEach(([k]) => { peg[k] = p[k] || ''; });
  return {
    bulan: bulan, pegawai: peg, perjalanan: [],
    makan: { sarapan: '', tengahari: '', malam: '', hari_makan: '', hari_harian: '' },
    lojing: { malam: '', senarai: [{ tarikh: '', alamat: '' }, { tarikh: '', alamat: '' }] },
    bsp: [{ kadar: '', hari: '', resit: '' }, { kadar: '', hari: '', resit: '' }],
    awam: Object.fromEntries(JENIS_AWAM.map((j) => [j.kod, { rm: '', resit: '' }])),
    tol: { rm: '', rujukan: '' }, parkir: { rm: '', rujukan: '' },
    pengakuan: { tanpa_resit: '', resit_bukan_nama: '', tarikh: '' }, pendahuluan: ''
  };
}

/** Lengkapkan struktur data lama supaya semua medan editor wujud. */
function lengkapkan(d) {
  const asas = dataBaru(d.bulan);
  const o = Object.assign(asas, d);
  o.makan = Object.assign(asas.makan, d.makan);
  o.lojing = Object.assign({ malam: '', senarai: [] }, d.lojing);
  while (o.lojing.senarai.length < 2) o.lojing.senarai.push({ tarikh: '', alamat: '' });
  o.bsp = (d.bsp || []).slice();
  while (o.bsp.length < 2) o.bsp.push({ kadar: '', hari: '', resit: '' });
  o.awam = Object.assign(dataBaru(d.bulan).awam, d.awam);
  return o;
}
